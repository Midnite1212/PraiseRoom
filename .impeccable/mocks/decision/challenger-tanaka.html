<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Plane Wave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F4F6F5; --indigo:#1E2A78; --ocean:#2C6BBF; --green:#2FA39A; --pale:#BBD0EA; --ink:#14183A; --muted:#4A5170; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:390px; height:844px; overflow:hidden; background:var(--paper); color:var(--ink); }
  body { font-family:'Hanken Grotesk', sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(6, 1fr); column-gap:10px; padding:0 20px; }
  .brand { grid-column:1 / 7; display:flex; justify-content:space-between; padding-top:22px; font-size:14px; font-weight:500; color:var(--muted); }
  .brand a { color:var(--indigo); font-weight:700; text-decoration:none; }
  .wave { position:relative; grid-column:1 / 7; height:250px; margin-top:16px; }
  .p { position:absolute; display:flex; align-items:flex-end; justify-content:flex-start; padding:10px 12px; color:var(--paper); font-weight:800; font-size:22px; }
  .p1 { left:0; bottom:0; width:200px; height:120px; background:var(--indigo); border-radius:0 120px 0 0; }
  .p2 { left:120px; bottom:60px; width:150px; height:150px; background:var(--ocean); border-radius:150px 150px 0 0; align-items:center; justify-content:center; }
  .p3 { left:216px; bottom:150px; width:100px; height:100px; background:var(--green); border-radius:0 100px 0 0; color:var(--ink); }
  .p4 { left:200px; bottom:0; width:150px; height:60px; background:var(--pale); color:var(--ink); justify-content:flex-end; }
  .title { grid-column:1 / 7; margin-top:20px; }
  h1 { font-weight:800; font-size:34px; line-height:1.02; letter-spacing:-.02em; }
  .meta { font-size:15px; color:var(--muted); margin-top:6px; }
  .now { grid-column:1 / 7; display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding-top:14px; border-top:3px solid var(--ink); }
  .now b { font-weight:800; font-size:22px; }
  .now span { display:flex; gap:8px; }
  .now em { font-style:normal; font-weight:700; font-size:15px; background:var(--ink); color:var(--paper); padding:7px 12px; }
  .now em.off { background:var(--pale); color:var(--ink); }
  .read { grid-column:1 / 7; margin-top:16px; }
  .sec { font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--ocean); margin-bottom:10px; }
  .line { display:flex; flex-wrap:wrap; margin-bottom:12px; }
  .seg { display:flex; flex-direction:column; }
  .c { font-weight:800; font-size:17px; height:22px; color:var(--ocean); }
  .l { font-size:21px; line-height:1.3; white-space:pre; }
</style>
</head>
<body>
  <div class="grid">
    <p class="brand"><span>Ripple Out Worship</span><a href="#">Copy link</a></p>
    <nav class="wave" aria-label="Songs in this setlist">
      <div class="p p1">2</div>
      <div class="p p2">3</div>
      <div class="p p3">1</div>
      <div class="p p4">4</div>
    </nav>
    <div class="title"><h1>Thursday Care Group</h1><p class="meta">Thu 15 Oct · 4 songs</p></div>
    <div class="now"><b>1 · Amazing Grace</b><span><em>Chords</em><em class="off">Key G</em></span></div>
    <main class="read">
      <p class="sec">Verse 1</p>
      <div class="line"><span class="seg"><span class="c">G</span><span class="l">Amazing </span></span><span class="seg"><span class="c">G7</span><span class="l">grace, how </span></span><span class="seg"><span class="c">C</span><span class="l">sweet the </span></span><span class="seg"><span class="c">G</span><span class="l">sound</span></span></div>
      <div class="line"><span class="seg"><span class="c"></span><span class="l">That </span></span><span class="seg"><span class="c">G</span><span class="l">saved a wretch like </span></span><span class="seg"><span class="c">D</span><span class="l">me</span></span></div>
      <div class="line"><span class="seg"><span class="c"></span><span class="l">I </span></span><span class="seg"><span class="c">G</span><span class="l">once was </span></span><span class="seg"><span class="c">G7</span><span class="l">lost, but </span></span><span class="seg"><span class="c">C</span><span class="l">now am </span></span><span class="seg"><span class="c">G</span><span class="l">found</span></span></div>
      <div class="line"><span class="seg"><span class="c"></span><span class="l">Was </span></span><span class="seg"><span class="c">Em</span><span class="l">blind but </span></span><span class="seg"><span class="c">D</span><span class="l">now I </span></span><span class="seg"><span class="c">G</span><span class="l">see</span></span></div>
    </main>
  </div>
</body>
</html>
