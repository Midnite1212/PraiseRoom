<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>The Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --spray:#F5F9FA; --navy:#0D2B45; --swell:#1F6FB2; --crest:#19B3B1; --rule:#D5E1E8; --muted:#4D6478; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:390px; height:844px; overflow:hidden; background:var(--spray); color:var(--navy); }
  body { font-family:'Geist', sans-serif; }
  .head { padding:22px 20px 0; }
  .brand { display:flex; justify-content:space-between; font-size:14px; font-weight:500; color:var(--muted); }
  .brand a { color:var(--swell); text-decoration:none; font-weight:600; }
  h1 { font-weight:600; font-size:34px; line-height:1.05; letter-spacing:-.02em; margin-top:22px; }
  .meta { font-family:'Geist Mono'; font-size:14px; color:var(--muted); margin-top:8px; letter-spacing:.02em; }
  .chart { margin:22px 20px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:16px 0 10px; }
  .label { font-family:'Geist Mono'; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; }
  .bars { display:flex; align-items:flex-end; gap:14px; height:118px; margin-top:12px; }
  .bar { flex:1; display:flex; flex-direction:column; align-items:stretch; gap:8px; }
  .bar i { display:block; background:var(--swell); border-radius:40px 40px 4px 4px; opacity:.28; }
  .bar.now i { background:var(--crest); opacity:1; }
  .bar span { font-family:'Geist Mono'; font-size:14px; text-align:center; }
  .bar.now span { font-weight:500; color:var(--navy); }
  .data { display:grid; grid-template-columns:repeat(3,1fr); margin:0 20px; border-bottom:1px solid var(--rule); }
  .data div { padding:12px 0; }
  .data small { display:block; font-family:'Geist Mono'; font-size:12px; color:var(--muted); letter-spacing:.06em; }
  .data b { font-size:22px; font-weight:600; }
  .read { padding:20px 20px 0; }
  .read h2 { font-size:24px; font-weight:600; letter-spacing:-.01em; }
  .sec { font-family:'Geist Mono'; font-size:13px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin:14px 0 10px; }
  .line { display:flex; flex-wrap:wrap; margin-bottom:12px; }
  .seg { display:flex; flex-direction:column; }
  .c { font-weight:700; font-size:17px; height:22px; color:var(--swell); }
  .l { font-size:21px; line-height:1.3; white-space:pre; }
</style>
</head>
<body>
  <header class="head">
    <p class="brand"><span>Ripple Out Worship</span><a href="#">Copy link</a></p>
    <h1>Thursday Care Group</h1>
    <p class="meta">THU 15 OCT · SET OF 4</p>
  </header>
  <section class="chart" aria-label="Songs in this set">
    <p class="label"><span>THE SET</span><span>TEMPO</span></p>
    <div class="bars">
      <div class="bar now"><i style="height:52px"></i><span>1</span></div>
      <div class="bar"><i style="height:64px"></i><span>2</span></div>
      <div class="bar"><i style="height:44px"></i><span>3</span></div>
      <div class="bar"><i style="height:86px"></i><span>4</span></div>
    </div>
  </section>
  <div class="data">
    <div><small>KEY</small><b>− G +</b></div>
    <div><small>TIME</small><b>3/4</b></div>
    <div><small>CHORDS</small><b>On</b></div>
  </div>
  <main class="read">
    <h2>Amazing Grace</h2>
    <p class="sec">Verse 1</p>
    <div class="line"><span class="seg"><span class="c">G</span><span class="l">Amazing </span></span><span class="seg"><span class="c">G7</span><span class="l">grace, how </span></span><span class="seg"><span class="c">C</span><span class="l">sweet the </span></span><span class="seg"><span class="c">G</span><span class="l">sound</span></span></div>
    <div class="line"><span class="seg"><span class="c"></span><span class="l">That </span></span><span class="seg"><span class="c">G</span><span class="l">saved a wretch like </span></span><span class="seg"><span class="c">D</span><span class="l">me</span></span></div>
    <div class="line"><span class="seg"><span class="c"></span><span class="l">I </span></span><span class="seg"><span class="c">G</span><span class="l">once was </span></span><span class="seg"><span class="c">G7</span><span class="l">lost, but </span></span><span class="seg"><span class="c">C</span><span class="l">now am </span></span><span class="seg"><span class="c">G</span><span class="l">found</span></span></div>
    <div class="line"><span class="seg"><span class="c"></span><span class="l">Was </span></span><span class="seg"><span class="c">Em</span><span class="l">blind but </span></span><span class="seg"><span class="c">D</span><span class="l">now I </span></span><span class="seg"><span class="c">G</span><span class="l">see</span></span></div>
  </main>
</body>
</html>
