          pinned: 'Pinned', nextLabel: 'Next', now: 'Now', start: 'Start', choosePane: 'Choose a song',
          chooseLeft: 'Play now', chooseRight: 'Show beside it', sections: 'Sections', section: 'Section',
          screenAwake: 'Screen stays awake while this is open', awakeOff: 'This browser may let the screen sleep',
          songOf: (i, n) => `Song ${i} of ${n}`, nextSong: 'Next song', moveSong: (s) => `Move ${s}`,
          presentNext: 'Next', presentEnd: 'End of the set',
        },
        'zh-Hant': {
          setlist: '歌單', songs: (n) => `${n} 首詩歌`, changeSongs: '切換詩歌', previous: '上一首', next: '下一首',
          key: '調', chooseKey: '轉調', originalHint: '原調', lyrics: '歌詞', chords: '和弦', show: '顯示',
          notation: '和弦標記', numbers: '數字', letters: '字母', textSize: '字體大小', smaller: '縮小', larger: '放大',
          copyLink: '複製連結', linkCopied: '已複製連結', signIn: '登入', signInMock: '此示範未包含登入', more: '更多',
          appearance: '外觀', dark: '深色', light: '淺色', system: '系統', language: '語言', songInfo: '詩歌資料',
          artist: '作者', originalKey: '原調', tempo: '速度', time: '拍子', themes: '主題', close: '關閉',
          upNext: '下一首', endOfSet: '歌單完結', credit: '由 Praise Room 分享', noLyrics: '暫時未有歌詞。',
          glassDemo: '折射效果（示範用）', glassRefract: '鏡片邊緣（Chromium）', glassFrost: '磨砂玻璃',
          glassUnsupported: '磨砂：此瀏覽器不支援折射', reading: '閱讀設定', autoScroll: '自動捲動',
          autoHint: '觸碰即停', slower: '減慢', faster: '加快', splitView: '分屏顯示', splitHint: '兩首詩歌並排',
          present: '投放到電視', exit: '離開', showChords: '顯示和弦', keepScrolling: '繼續捲動即開始',
          editOrder: '調整次序', done: '完成', yourOrder: '你的次序', resetOrder: '還原領詩者次序',
          orderNote: '只影響這部裝置', followSet: '下一首（跟隨歌單）', pinned: '已固定', nextLabel: '下一首',
          now: '現在', start: '開始', choosePane: '選擇詩歌', chooseLeft: '現在唱', chooseRight: '並排顯示',
          sections: '段落', section: '段落', screenAwake: '開啟期間螢幕保持亮着', awakeOff: '此瀏覽器或會令螢幕休眠',
          songOf: (i, n) => `第 ${i} 首，共 ${n} 首`, nextSong: '下一首', moveSong: (s) => `移動 ${s}`,
          presentNext: '下一句', presentEnd: '歌單完結',
        },
      };

      // ---------- Sample data (public-domain hymns + one synthetic demo song) ----------
      const SETLIST = {
        name: 'Sunday Morning Worship',
        date: '2026-10-25',
        songs: [
          { title: 'Holy, Holy, Holy', artist: 'Reginald Heber', originalKey: 'D', tempo: 'Medium', time: '4/4', themes: 'Holiness, Trinity',
            lyrics: `{Verse 1}\n[D]Holy, holy, [Bm]holy! [G]Lord God Al[D]mighty!\n[D]Early in the [G]morning our [A]song shall rise to [D]Thee;\n[D]Holy, holy, [Bm]holy! [G]Merciful and [D]mighty!\n[Bm]God in three [G]Persons, [D]bless[A]ed Trini[D]ty!\n\n{Verse 2}\n[D]Holy, holy, [Bm]holy! All the [G]saints a[D]dore Thee,\n[D]Casting down their [G]golden crowns a[A]round the glassy [D]sea;\n[D]Cherubim and [Bm]seraphim [G]falling down be[D]fore Thee,\n[Bm]Which wert, and [G]art, and [D]ever[A]more shalt [D]be.` },
          { title: 'Amazing Grace', artist: 'John Newton', originalKey: 'G', setKey: 'A', tempo: 'Slow', time: '3/4', themes: 'Grace',
            lyrics: `{Verse 1}\nA[G]mazing grace! How [G7]sweet the [C]sound\nThat [G]saved a wretch like [D]me!\nI [G]once was lost, but [G7]now am [C]found;\nWas [G]blind, but [D]now I [G]see.\n\n{Verse 2}\n'Twas [G]grace that taught my [G7]heart to [C]fear,\nAnd [G]grace my fears re[D]lieved;\nHow [G]precious did that [G7]grace ap[C]pear\nThe [G]hour I [D]first be[G]lieved.\n\n{Verse 3}\nThrough [G]many dangers, [G7]toils and [C]snares,\nI [G]have already [D]come;\n'Tis [G]grace hath brought me [G7]safe thus [C]far,\nAnd [G]grace will [D]lead me [G]home.` },
          { title: 'Be Thou My Vision', artist: 'Traditional Irish', originalKey: 'Eb', tempo: 'Slow', time: '3/4', themes: 'Devotion',
            lyrics: `{Verse 1}\n[Eb]Be Thou my [Ab]Vision, O [Eb]Lord of my [Bb]heart;\n[Cm]Naught be all [Bb]else to me, [Eb]save that Thou [Bb]art.\n[Eb]Thou my best [Gm]Thought, by [Ab]day or by [Bb]night,\n[Ab]Waking or [Eb]sleeping, Thy [Bb]presence my [Eb]light.\n\n{Verse 2}\n[Eb]Be Thou my [Ab]Wisdom, and [Eb]Thou my true [Bb]Word;\n[Cm]I ever [Bb]with Thee and [Eb]Thou with me, [Bb]Lord.` },
          { title: '晨光讚美（示範）', artist: 'Praise Room 示範資料', originalKey: 'A', tempo: 'Medium', time: '4/4', themes: '讚美',
            lyrics: `{主歌}\n[A]我要歌唱 [D]讚美祢[A]名\n[F#m]在祢面前 [D]我心安[E]寧\n[A]晨光初現 [D]祢恩常[A]新\n[D]一生跟[E]隨 不離[A]棄\n\n{副歌}\n[D]哈利[E]路亞 [C#m]讚美[F#m]主\n[D]祢的[E]慈愛 [A]永長[A7]存\n[D]哈利[E]路亞 [C#m]讚美[F#m]主\n[Bm]一生[E]敬拜 [A]祢` },
          { title: 'Doxology', artist: 'Thomas Ken', originalKey: 'G', tempo: 'Medium', time: '4/4', themes: 'Praise',
            lyrics: `{Doxology}\n[G]Praise God, from [D]whom all [Em]blessings [C]flow;\n[G]Praise Him, all [Am]creatures [D]here be[G]low;\n[G]Praise Him a[D]bove, ye [Em]heavenly [C]host;\n[G]Praise Father, [C]Son, and [D]Holy [G]Ghost.` },
        ],
      };

      // ---------- Music theory (mirrors src/features/chords in the app) ----------
      const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
      const SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const FLATS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
      const MAJOR_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
      const MINOR_NAMES = ['Cm', 'C#m', 'Dm', 'Ebm', 'Em', 'Fm', 'F#m', 'Gm', 'G#m', 'Am', 'Bbm', 'Bm'];
      const DEGREES = ['1', 'b2', '2', 'b3', '3', '4', 'b5', '5', 'b6', '6', 'b7', '7'];

      const parseNote = (s) => {
        const m = /^([A-G])([#b]?)/.exec(s);
        if (!m) return null;
        return { pc: (PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? 11 : 0)) % 12, len: m[0].length };
      };
      const parseKey = (s) => {
        const n = parseNote(s);
        return n ? { root: n.pc, minor: s.slice(n.len) === 'm' } : null;
      };
      const keyName = (k) => (k.minor ? MINOR_NAMES : MAJOR_NAMES)[k.root];
      const prefersFlats = (k) => keyName(k).includes('b') || (!k.minor && k.root === 5) || (k.minor && [0, 2, 5, 7].includes(k.root));

      const splitChord = (chord) => {
        const m = /^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/.exec(chord);
        return m ? { root: m[1], quality: m[2], bass: m[3] } : null;
      };
      const transposeChord = (chord, semis, flats) => {
        const p = splitChord(chord);
        if (!p) return chord;
        const names = flats ? FLATS : SHARPS;
        const move = (n) => names[(parseNote(n).pc + semis + 12) % 12];
        return move(p.root) + p.quality + (p.bass ? '/' + move(p.bass) : '');
      };
      const numberChord = (chord, key) => {
        const p = splitChord(chord);
        if (!p) return chord;
        const deg = (n) => DEGREES[(parseNote(n).pc - key.root + 12) % 12];
        const q = p.quality;
        const minor = /^m(?!aj)/.test(q);
        const rest = minor ? q.slice(1) : q;
        return `${deg(p.root)}${minor ? 'm' : ''}${rest ? `<sup>${escapeHtml(rest)}</sup>` : ''}${p.bass ? '/' + deg(p.bass) : ''}`;
      };
      const signed = (from, to) => ((to.root - from.root + 18) % 12) - 6;

      // ---------- Lyrics parsing ----------
      const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      const parseLyrics = (text) => {
        const sections = [];
        let cur = null;
        for (const raw of text.split('\n')) {
          const label = /^\{(.+)\}$/.exec(raw.trim());
          if (label) {
            cur = { label: label[1], lines: [] };
            sections.push(cur);
            continue;
          }
          if (!cur) sections.push((cur = { label: null, lines: [] }));
          const segs = [];
          const re = /\[([^\]]+)\]/g;
          let last = 0;
          let chord = null;
          let m;
          while ((m = re.exec(raw))) {
            if (m.index > last || chord !== null) segs.push({ chord, lyric: raw.slice(last, m.index) });
            chord = m[1];
            last = re.lastIndex;
          }
          if (last < raw.length || chord !== null) segs.push({ chord, lyric: raw.slice(last) });
          cur.lines.push(segs.filter((s) => s.chord !== null || s.lyric !== ''));
        }
        for (const s of sections) {
          while (s.lines.length && s.lines[0].length === 0) s.lines.shift();
          while (s.lines.length && s.lines.at(-1).length === 0) s.lines.pop();
        }
        return sections.filter((s) => s.lines.length);
      };

      // ---------- State ----------
      const store = {
        get(k, fallback) {
          try {
            const v = localStorage.getItem('pr-mock-' + k);
            return v === null ? fallback : JSON.parse(v);
          } catch {
            return fallback;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem('pr-mock-' + k, JSON.stringify(v));
          } catch {}
        },
      };
      const SIZES = ['1rem', '1.125rem', '1.375rem', '1.625rem', '2rem'];
      const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3];
      const browserLang = (navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh-Hant' : 'en';
      const N = SETLIST.songs.length;
      const identity = SETLIST.songs.map((_, i) => i);
      const savedOrder = store.get('order', null);
      const validOrder = (o) => Array.isArray(o) && o.length === N && identity.every((i) => o.includes(i));
      const state = {
        order: validOrder(savedOrder) ? savedOrder : identity.slice(),
        pos: 0,
        mode: store.get('mode', 'chords'),
        notation: store.get('notation', 'letters'),
        size: store.get('size', 1),
        theme: store.get('theme', 'dark'),
        lang: store.get('lang', browserLang),
        refract: store.get('refract', true),
        split: store.get('split', true),
        speed: store.get('speed', 2),
        auto: false,
        autoShown: false,
        chosen: {},
        pin: null,
        editing: false,
      };
      const startSong = Math.min(Math.max(Number(new URLSearchParams(location.search).get('song')) || 2, 1), N) - 1;
      state.pos = state.order.indexOf(startSong);

      const t = (k, ...a) => {
        const v = COPY[state.lang][k];
        return typeof v === 'function' ? v(...a) : v;
      };
      const $ = (id) => document.getElementById(id);
      const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
      const songAt = (p) => state.order[p];
      const cur = () => songAt(state.pos);
      const isCustomOrder = () => state.order.some((s, i) => s !== i);
      const nextNatural = () => (state.pos < N - 1 ? songAt(state.pos + 1) : null);
      const rightSong = () => (state.pin !== null ? state.pin : nextNatural());
      const splitMQ = matchMedia('(min-width: 900px) and (orientation: landscape)');
      const inSplit = () => state.split && splitMQ.matches;
      const scroller = () => (inSplit() ? $('pane-left') : document.scrollingElement);

      const songKeys = (si) => {
        const song = SETLIST.songs[si];
        const original = parseKey(song.originalKey);
        const chosen = state.chosen[si];
        const play = chosen !== undefined ? { root: chosen, minor: original.minor } : parseKey(song.setKey || song.originalKey);
        return { original, play };
      };

      // ---------- Rendering ----------
      const dateLabel = () =>
        new Intl.DateTimeFormat(state.lang === 'zh-Hant' ? 'zh-HK' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(SETLIST.date + 'T00:00:00'));

      const chordRenderer = (si) => {
        const { original, play } = songKeys(si);
        const semis = (play.root - original.root + 12) % 12;
        const flats = prefersFlats(play);
        return (c) => (state.notation === 'numbers' ? numberChord(c, original) : escapeHtml(transposeChord(c, semis, flats)));
      };

      const lineHtml = (chordsOn, rc) => (segs) => {
        if (!segs.length) return '<div class="gap" aria-hidden="true"></div>';
        const hasChords = segs.some((s) => s.chord);
        if (!chordsOn || !hasChords) {
          const text = segs.map((s) => s.lyric).join('');
          return text.trim() ? `<p class="line plain">${escapeHtml(text)}</p>` : '';
        }
        return `<p class="line has-chords">${segs
          .map((s) => `<span class="seg-word"><span class="ch">${s.chord ? rc(s.chord) : ''}</span><span class="ly">${s.lyric ? escapeHtml(s.lyric) : ' '}</span></span>`)
          .join('')}</p>`;
      };

      const lyricsHtml = (si, { limit = Infinity, ids = '' } = {}) => {
        const sections = parseLyrics(SETLIST.songs[si].lyrics).slice(0, limit);
        if (!sections.length) return `<p class="no-lyrics">${t('noLyrics')}</p>`;
        const chordsOn = state.mode === 'chords';
        const line = lineHtml(chordsOn, chordRenderer(si));
        return `<div class="lyrics ${chordsOn ? 'chords-on' : ''}">${sections
          .map((sec, k) => `<section${ids ? ` id="${ids}-${k}"` : ''}>${sec.label ? `<h3>${escapeHtml(sec.label)}</h3>` : ''}${sec.lines.map(line).join('')}</section>`)
          .join('')}</div>`;
      };

      const offsetLabel = (off) => (off === 0 ? '0' : `${off > 0 ? '+' : '−'}${Math.abs(off)}`);

      // The key, lyrics/chords and notation controls, for the current song only.
      const controlsHtml = (si, ghost = false) => {
        const { original, play } = songKeys(si);
        const off = signed(original, play);
        const id = (x) => (ghost ? '' : ` id="${x}"`);
        return `<div class="controls${ghost ? ' ghost' : ''}"${ghost ? ' aria-hidden="true" inert' : ''}>
          <div class="glass" data-glass data-blur="2"${id('key-wrap')}${state.mode === 'chords' ? '' : ' hidden'}>
            <button class="key-btn"${id('key-btn')} data-action="key" aria-haspopup="dialog" aria-expanded="false" aria-label="${t('key')} ${keyName(play)}">
              <span class="k-label">${t('key')}</span><span class="k-name">${keyName(play)}</span><span class="offset" data-zero="${off === 0}">${offsetLabel(off)}</span>
            </button>
          </div>
          <div class="glass" data-glass data-blur="2">
            <div class="seg"${id('mode-seg')} role="group" aria-label="${t('show')}">
              <span class="thumb" aria-hidden="true"></span>
              <button data-value="lyrics" data-seg="mode">${t('lyrics')}</button>
              <button data-value="chords" data-seg="mode">${t('chords')}</button>
            </div>
          </div>
          <div class="glass" data-glass data-blur="2"${state.mode === 'chords' ? '' : ' hidden'}>
            <div class="seg nums"${id('notation-seg')} role="group" aria-label="${t('notation')}">
              <span class="thumb" aria-hidden="true"></span>
              <button data-value="numbers" data-seg="notation" aria-label="${t('numbers')}">1 4 5</button>
              <button data-value="letters" data-seg="notation" aria-label="${t('letters')}">A B C</button>
            </div>
          </div>
        </div>`;
      };

      const songHeadHtml = (si, { ghost = false, jumpTarget = 'sec' } = {}) => {
        const song = SETLIST.songs[si];
        const secs = parseLyrics(song.lyrics);
        const level = ghost ? 'h2' : 'h1';
        return `<header class="song-head">
          <div class="title-row">
            <${level}${ghost ? '' : ' id="song-title"'}>${escapeHtml(song.title)}</${level}>
            ${ghost ? '' : `<button class="tap" data-action="info" aria-haspopup="dialog" aria-expanded="false" aria-label="${t('songInfo')}" title="${t('songInfo')}">${icon('circle-info')}</button>`}
          </div>
          <p class="artist">${escapeHtml(song.artist)}</p>
          ${ghost ? '' : controlsHtml(si)}
          ${
            !ghost && secs.length > 1
              ? `<nav class="jump${ghost ? ' ghost' : ''}" aria-label="${t('sections')}"${ghost ? ' aria-hidden="true" inert' : ''}>${secs
                  .map((s, k) => `<button data-jump="${jumpTarget}-${k}">${escapeHtml(s.label || `${t('section')} ${k + 1}`)}</button>`)
                  .join('')}</nav>`
              : ''
          }
        </header>`;
      };

      const endHtml = () =>
        `<div class="end-set"><span class="row" aria-hidden="true">${state.order.map(() => '<i></i>').join('')}</span><span>${t('endOfSet')}</span></div>`;

      // Portrait: one song, then the next song's opening flows on, dimmed.
      const renderScroll = () => {
        const si = cur();
        $('scroll-song').innerHTML = songHeadHtml(si) + lyricsHtml(si, { ids: 'sec' });
        const nx = nextNatural();
        if (nx === null) {
          $('flow').innerHTML = endHtml();
          return;
        }
        const { play } = songKeys(nx);
        $('flow').innerHTML = `<button class="flow-head" data-action="next">
            <span class="pixel" aria-hidden="true"></span>
            <span style="min-width: 0"><small>${t('upNext')} · ${state.pos + 2}/${N}</small><strong>${escapeHtml(SETLIST.songs[nx].title)}</strong></span>
            <span class="k">${keyName(play)}</span>
          </button>
          <div class="flow-body" id="flow-body" aria-hidden="true">${lyricsHtml(nx, { limit: 1 })}</div>
          <p class="flow-hint">↓ ${t('keepScrolling')}</p>
          <div class="flow-spacer" aria-hidden="true"></div>`;
      };

      // Wide: now on the left, next (or a pinned song) on the right.
      const renderSplit = () => {
        const L = cur();
        const R = rightSong();
        $('pane-left').innerHTML = `<div class="pane-row">
            <button class="pane-pick" data-action="pick" data-side="left" aria-haspopup="dialog" aria-expanded="false">${t('now')} · ${state.pos + 1}/${N}${icon('chevron-down')}</button>
          </div>${songHeadHtml(L, { jumpTarget: 'psec' })}${lyricsHtml(L, { ids: 'psec' })}`;
        if (R === null) {
          $('pane-right').innerHTML = `<div class="pane-row">
              <button class="pane-pick" data-action="pick" data-side="right" aria-haspopup="dialog" aria-expanded="false">${t('nextLabel')}${icon('chevron-down')}</button>
            </div><div class="pane-end">${endHtml()}</div>`;
          return;
        }
        const pinned = state.pin !== null;
        $('pane-right').innerHTML = `<div class="pane-row">
            <button class="pane-pick" data-action="pick" data-side="right" aria-haspopup="dialog" aria-expanded="false">${pinned ? '<span class="pin-dot" aria-hidden="true"></span>' + t('pinned') : t('nextLabel')} · ${state.order.indexOf(R) + 1}/${N}${icon('chevron-down')}</button>
            <button class="start-btn" data-action="next">${t('start')}${icon('chevron-right')}</button>
          </div><div class="pane-body">${songHeadHtml(R, { ghost: true })}${lyricsHtml(R)}</div>`;
      };

      const rowsHtml = () =>
        state.order
          .map((si, p) => {
            const song = SETLIST.songs[si];
            const k = songKeys(si).play;
            const lead = state.editing
              ? `<span class="grip" role="button" tabindex="0" data-grip aria-label="${escapeHtml(t('moveSong', song.title))}"></span>`
              : '';
            return `<li data-song="${si}"><${state.editing ? 'div' : 'button'} class="song-row${state.editing ? ' editing' : ''}" ${state.editing ? '' : `data-go="${p}"`} ${p === state.pos ? 'aria-current="true"' : ''}>
              ${lead}<span class="pixel${p < state.pos ? ' played' : ''}" aria-hidden="true"></span>
              <span class="num">${p + 1}</span>
              <span class="title">${escapeHtml(song.title)}</span>
              <span class="key">${keyName(k)}</span></${state.editing ? 'div' : 'button'}></li>`;
          })
          .join('');

      const renderList = () => {
        $('sheet-rows').innerHTML = rowsHtml();
        $('edit-order').textContent = state.editing ? t('done') : t('editOrder');
        const custom = isCustomOrder();
        $('sheet-foot').hidden = !(state.editing || custom);
        $('sheet-foot-text').textContent = custom ? t('yourOrder') + ' · ' + t('orderNote') : t('orderNote');
        $('sheet-foot').querySelector('[data-action="reset-order"]').hidden = !custom;
      };

      const placeLens = () => {
        const px = N > 14 ? 7 : N > 8 ? 10 : 12;
        const gap = N > 14 ? 3 : N > 8 ? 5 : 6;
        $('spectrum').style.setProperty('--px', px + 'px');
        $('spectrum').style.setProperty('--px-gap', gap + 'px');
        $('lens').style.transform = `translateX(${2 + state.pos * (px + gap) - 5}px)`;
        document.documentElement.style.setProperty('--dock-min-w', N * (px + gap) - gap + 44 + 'px');
      };

      const renderDock = () => {
        const si = cur();
        $('spectrum').innerHTML =
          state.order.map((_, p) => `<i class="${p === state.pos ? 'now' : p < state.pos ? 'played' : ''}"></i>`).join('') +
          '<span class="lens glass" data-glass data-blur="0.4" data-bezel="5" id="lens"></span>';
        placeLens();
        Glass.watch($('lens'));
        $('dock-count').textContent = `${state.pos + 1}/${N}`;
        $('dock-name').textContent = SETLIST.songs[si].title;
        $('spectrum-btn').setAttribute('aria-label', `${t('setlist')}: ${state.pos + 1} / ${N}, ${SETLIST.songs[si].title}`);
        const target = rightSong();
        $('prev').disabled = state.pos === 0;
        $('next').disabled = target === null;
        $('next-name').textContent = target === null ? '' : SETLIST.songs[target].title;
        $('next').setAttribute('aria-label', target === null ? t('next') : `${t('next')}: ${SETLIST.songs[target].title}`);
        $('order-chip').hidden = !isCustomOrder();
      };

      const renderBar = () => {
        const si = cur();
        $('bar-song').textContent = SETLIST.songs[si].title;
        $('bar-key').textContent = keyName(songKeys(si).play);
        $('bar-song-sub').textContent = `${state.pos + 1} / ${N} · ${SETLIST.name}`;
      };

      const renderStatic = () => {
        document.documentElement.lang = state.lang === 'zh-Hant' ? 'zh-Hant' : 'en';
        document.querySelectorAll('[data-icon]').forEach((el) => {
          if (ICONS[el.dataset.icon]) el.outerHTML = icon(el.dataset.icon);
        });
        document.querySelectorAll('[data-i18n]').forEach((el) => (el.textContent = t(el.dataset.i18n)));
        document.querySelectorAll('[data-i18n-label]').forEach((el) => {
          el.setAttribute('aria-label', t(el.dataset.i18nLabel));
          if (el.tagName === 'BUTTON' && !el.closest('.seg')) el.title = t(el.dataset.i18nLabel);
        });
        $('bar-setlist').textContent = SETLIST.name;
        $('bar-date').textContent = dateLabel();
        $('sheet-title').textContent = SETLIST.name;
        $('sheet-meta').textContent = `${dateLabel()} · ${t('songs', N)}`;
      };

      // Re-observe the song header so the top bar can switch to the song once it scrolls away.
      const headIO = new IntersectionObserver(
        ([entry]) => {
          if (!entry) return;
          const past = !entry.isIntersecting && entry.boundingClientRect.top < 80 && !inSplit();
          document.body.classList.toggle('scrolled', past);
          document.querySelector('.song-mode').setAttribute('aria-hidden', String(!past));
        },
        { rootMargin: '-80px 0px 0px 0px' }
      );

      // Flow on: once the next song's opening reaches the top third, it becomes the current song,
      // re-rendered in place so the lines under the reader's eye don't move.
      const flowIO = new IntersectionObserver(
        (entries) => {
          if (inSplit()) return;
          for (const e of entries) {
            if (e.target.id === 'flow-body' && e.isIntersecting && e.boundingClientRect.top < innerHeight * 0.34) commitFlow();
            if (e.target.id === 'flow') document.documentElement.classList.toggle('named', e.isIntersecting || inSplit());
          }
        },
        { rootMargin: '0px 0px -66% 0px' }
      );
      const nearIO = new IntersectionObserver(
        ([e]) => {
          if (!e || inSplit()) return;
          document.documentElement.classList.toggle('named', e.isIntersecting);
          if (e.isIntersecting) document.documentElement.classList.remove('dock-min');
        },
        { rootMargin: '0px 0px 0px 0px' }
      );

      const observe = () => {
        headIO.disconnect();
        flowIO.disconnect();
        nearIO.disconnect();
        const head = inSplit() ? null : document.querySelector('#scroll-song .song-head');
        if (head) headIO.observe(head);
        if (!inSplit()) {
          const fb = $('flow-body');
          if (fb) flowIO.observe(fb);
          // "Named next" appears once the last section of the song is on screen.
          const last = document.querySelector('#scroll-song .lyrics section:last-of-type') || $('flow');
          nearIO.observe(last);
        }
        document.documentElement.classList.toggle('named', inSplit() && rightSong() !== null);
      };

      const render = () => {
        const split = inSplit();
        document.documentElement.classList.toggle('split', split);
        if (split) {
          document.body.classList.remove('scrolled');
          document.documentElement.classList.remove('dock-min');
          renderSplit();
        } else {
          renderScroll();
          $('scroll-view').classList.toggle('two-col', innerWidth >= 1280);
        }
        renderBar();
        renderDock();
        renderList();
        renderInfo();
        renderKeyGrid();
        document.querySelectorAll('[data-glass]').forEach((el) => Glass.watch(el));
        syncSeg('mode-seg', state.mode);
        syncSeg('notation-seg', state.notation);
        observe();
      };

      const renderInfo = () => {
        const song = SETLIST.songs[cur()];
        $('info-list').innerHTML = [
          [t('artist'), song.artist],
          [t('originalKey'), song.originalKey],
          [t('tempo'), song.tempo],
          [t('time'), song.time],
          [t('themes'), song.themes],
        ]
          .map(([k, v]) => `<dt>${k}</dt><dd>${escapeHtml(v)}</dd>`)
          .join('');
      };

      const renderKeyGrid = () => {
        const { original, play } = songKeys(cur());
        $('key-grid').innerHTML = Array.from({ length: 12 }, (_, r) => {
          const k = { root: r, minor: original.minor };
          return `<button data-root="${r}" aria-pressed="${r === play.root}" ${r === original.root ? 'data-original="true"' : ''}>${keyName(k)}</button>`;
        }).join('');
      };

      const syncSeg = (id, value) => {
        const seg = $(id);
        if (!seg) return;
        const buttons = [...seg.querySelectorAll('button')];
        buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === value)));
        const on = buttons.find((b) => b.dataset.value === value);
        const thumb = seg.querySelector('.thumb');
        if (on && on.offsetWidth) {
          const fresh = !thumb.style.transform;
          if (fresh) thumb.style.transition = 'none';
          thumb.style.width = on.offsetWidth + 'px';
          thumb.style.transform = `translateX(${on.offsetLeft}px)`;
          if (fresh) requestAnimationFrame(() => requestAnimationFrame(() => (thumb.style.transition = '')));
        }
        // Ghost copies in the right pane mirror the same state.
        document.querySelectorAll(`.ghost .seg button[data-seg]`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === state[b.dataset.seg])));
      };

      const applyPrefs = () => {
        const sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = state.theme === 'system' ? sys : state.theme;
        document.documentElement.style.setProperty('--lyrics-size', SIZES[state.size]);
        $('meter').innerHTML = SIZES.map((_, j) => `<i class="${j <= state.size ? 'on' : ''}" style="height:${10 + j * 4}px"></i>`).join('');
        $('smaller').disabled = state.size === 0;
        $('larger').disabled = state.size === SIZES.length - 1;
        syncSeg('theme-seg', state.theme);
        syncSeg('lang-seg', state.lang);
        $('split-row').hidden = !splitMQ.matches;
        $('split-switch').setAttribute('aria-checked', String(state.split));
        Glass.enable(state.refract);
        const sw = $('refract-switch');
        sw.setAttribute('aria-checked', String(state.refract && Glass.supported));
        sw.disabled = !Glass.supported;
        $('glass-mode').textContent = !Glass.supported ? t('glassUnsupported') : state.refract ? t('glassRefract') : t('glassFrost');
        renderAuto();
        renderWake();
      };

      // ---------- Moving through the set ----------
      const updateURL = () => {
        const url = new URL(location.href);
        url.searchParams.set('song', String(cur() + 1));
        history.replaceState(null, '', url);
      };

      const enterAnim = (el, dir) => {
        if (!dir || reduced()) return;
        el.animate([{ opacity: 0, transform: `translateX(${dir * 28}px)`, filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'none' }], {
          duration: 520,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
        });
      };

      const go = (p, { seamless = false } = {}) => {
        if (p < 0 || p >= N || p === state.pos) return;
        const dir = p > state.pos ? 1 : -1;
        if (state.pin !== null && songAt(p) === state.pin) state.pin = null;
        state.pos = p;
        updateURL();
        closeAll();
        render();
        if (!inSplit() && !seamless) {
          scrollTo({ top: 0, behavior: 'instant' });
          enterAnim($('scroll-song'), dir);
        }
      };

      // Advance by one: in the split, the right pane slides over to the left.
      const advance = (dir) => {
        if (inSplit()) {
          if (dir > 0) {
            const target = rightSong();
            if (target === null) return;
            slide(1, () => {
              state.pos = state.order.indexOf(target);
              state.pin = null;
            });
          } else {
            if (state.pos === 0) return;
            slide(-1, () => {
              state.pos -= 1;
              state.pin = null;
            });
          }
          return;
        }
        go(state.pos + dir);
      };

      let sliding = false;
      const slide = (dir, commit) => {
        if (sliding) return;
        const left = $('pane-left');
        const right = $('pane-right');
        const shift = right.getBoundingClientRect().left - left.getBoundingClientRect().left;
        const finish = () => {
          commit();
          updateURL();
          closeAll();
          render();
          left.scrollTop = 0;
          right.scrollTop = 0;
        };
        if (reduced()) {
          finish();
          return;
        }
        sliding = true;
        const opts = { duration: 520, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' };
        const body = right.querySelector('.pane-body');
        const anims =
          dir > 0
            ? [
                left.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-shift * 0.3}px)` }], opts),
                right.animate([{ transform: 'none' }, { transform: `translateX(${-shift}px)` }], opts),
                body && body.animate([{ opacity: 0.5 }, { opacity: 1 }], opts),
              ]
            : [
                right.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${shift * 0.3}px)` }], opts),
                left.animate([{ transform: 'none', opacity: 1 }, { transform: `translateX(${shift}px)`, opacity: 0.5 }], opts),
              ];
        Promise.all(anims.filter(Boolean).map((a) => a.finished)).then(() => {
          finish();
          anims.forEach((a) => a && a.cancel());
          const incoming = dir > 0 ? right : left;
          incoming.animate([{ opacity: 0, transform: `translateX(${dir * 40}px)` }, { opacity: 1, transform: 'none' }], {
            duration: 420,
            easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
          });
          sliding = false;
        });
      };

      const commitFlow = () => {
        const fb = $('flow-body');
        if (!fb || state.pos >= N - 1) return;
        const y0 = fb.getBoundingClientRect().top;
        go(state.pos + 1, { seamless: true });
        const first = document.querySelector('#scroll-song .lyrics');
        if (first) scrollTo({ top: first.getBoundingClientRect().top + scrollY - y0, behavior: 'instant' });
      };

      // ---------- Song picker (split) ----------
      let pickSide = 'right';
      const openPick = (side, trigger) => {
        pickSide = side;
        $('pick-title').textContent = side === 'left' ? t('chooseLeft') : t('chooseRight');
        const follow =
          side === 'right' ? `<button class="pick-follow" data-pick="follow" ${state.pin === null ? 'aria-current="true"' : ''}>${t('followSet')}</button>` : '';
        const current = side === 'left' ? cur() : rightSong();
        $('pick-list').innerHTML =
          follow +
          state.order
            .map((si, p) => {
              if (side === 'right' && si === cur()) return '';
              const song = SETLIST.songs[si];
              return `<button class="song-row" data-pick="${si}" ${si === current && !(side === 'right' && state.pin === null) ? 'aria-current="true"' : ''}>
                <span class="pixel${p < state.pos ? ' played' : ''}" aria-hidden="true"></span><span class="num">${p + 1}</span>
                <span class="title">${escapeHtml(song.title)}</span><span class="key">${keyName(songKeys(si).play)}</span></button>`;
            })
            .join('');
        toggle($('pick-pop'), trigger);
      };

      // ---------- Auto-scroll ----------
      let autoRaf = 0;
      let autoLast = 0;
      let autoAcc = 0;
      const autoStep = (ts) => {
        if (!state.auto) return;
        const dt = autoLast ? Math.min((ts - autoLast) / 1000, 0.1) : 0;
        autoLast = ts;
        autoAcc += dt * 26 * SPEEDS[state.speed];
        const whole = Math.floor(autoAcc);
        if (whole) {
          scroller().scrollTop += whole;
          autoAcc -= whole;
        }
        autoRaf = requestAnimationFrame(autoStep);
      };
      const setAuto = (on) => {
        state.auto = on;
        if (on) state.autoShown = true;
        cancelAnimationFrame(autoRaf);
        autoLast = 0;
        autoAcc = 0;
        if (on) autoRaf = requestAnimationFrame(autoStep);
        renderAuto();
      };
      const renderAuto = () => {
        const label = `${SPEEDS[state.speed]}×`;
        $('auto-speed').textContent = label;
        $('pill-speed').textContent = label;
        const glyph = icon(state.auto ? 'pause' : 'play');
        $('auto-play').innerHTML = glyph;
        $('pill-play').innerHTML = glyph;
        $('auto-play').setAttribute('aria-pressed', String(state.auto));
        $('auto-pill').hidden = !state.autoShown;
        if (state.autoShown) Glass.refresh($('auto-pill'));
      };

      // ---------- Keep the screen awake ----------
      const wakeSupported = 'wakeLock' in navigator;
      let wake = null;
      const requestWake = async () => {
        if (!wakeSupported || document.visibilityState !== 'visible' || wake) return;
        try {
          wake = await navigator.wakeLock.request('screen');
          wake.addEventListener('release', () => {
            wake = null;
            renderWake();
          });
        } catch {}
        renderWake();
      };
      const renderWake = () => {
        $('wake-note').classList.toggle('off', !wake);
        $('wake-text').textContent = wake ? t('screenAwake') : t('awakeOff');
      };

      // ---------- Present (TV) ----------
      const P = { slides: [], i: 0, chords: store.get('presentChords', false) };
      const buildSlides = () => {
        const out = [];
        state.order.forEach((si, p) => {
          out.push({ type: 'title', si, p });
          parseLyrics(SETLIST.songs[si].lyrics).forEach((sec, k, all) => out.push({ type: 'sec', si, p, sec, k, total: all.length }));
        });
        return out;
      };
      const firstLine = (sec) => {
        const segs = sec.lines.find((l) => l.some((s) => s.lyric.trim()));
        return segs ? segs.map((s) => s.lyric).join('').trim() : '';
      };
      const openPresent = () => {
        closeAll();
        setAuto(false);
        P.slides = buildSlides();
        P.i = Math.max(0, P.slides.findIndex((s) => s.p === state.pos && s.type === 'title'));
        $('present').hidden = false;
        document.documentElement.classList.add('presenting');
        document.documentElement.requestFullscreen?.().catch(() => {});
        renderPresent();
        $('present').querySelector('[data-action="p-exit"]').focus({ preventScroll: true });
      };
      const closePresent = () => {
        if ($('present').hidden) return;
        const s = P.slides[P.i];
        $('present').hidden = true;
        document.documentElement.classList.remove('presenting');
        if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
        if (s && s.p !== state.pos) go(s.p);
      };
      const stepPresent = (d) => {
        P.i = Math.min(Math.max(P.i + d, 0), P.slides.length - 1);
        renderPresent();
      };
      const renderPresent = () => {
        const s = P.slides[P.i];
        if (!s) return;
        const song = SETLIST.songs[s.si];
        $('p-song').textContent = song.title;
        $('p-where').textContent = s.type === 'sec' && s.sec.label ? `${s.p + 1}/${N} · ${s.sec.label}` : `${s.p + 1}/${N}`;
        $('p-chords').setAttribute('aria-checked', String(P.chords));
        if (s.type === 'title') {
          $('p-stage').innerHTML = `<div class="p-slide p-title"><small>${t('songOf', s.p + 1, N)}</small><h2 id="p-heading">${escapeHtml(song.title)}</h2><p>${escapeHtml(song.artist)}</p></div>`;
        } else {
          const line = lineHtml(P.chords, chordRenderer(s.si));
          $('p-stage').innerHTML = `<div class="p-slide">${s.sec.label ? `<div class="p-label" id="p-heading">${escapeHtml(s.sec.label)}</div>` : ''}<div class="p-lines ${P.chords ? 'chords-on' : ''}">${s.sec.lines.map(line).join('')}</div></div>`;
          fitPresent();
        }
        const nx = P.slides[P.i + 1];
        $('p-next').textContent = !nx
          ? t('presentEnd')
          : nx.type === 'title'
            ? `${t('nextSong')}: ${SETLIST.songs[nx.si].title}`
            : `${t('presentNext')}: ${firstLine(nx.sec)}`;
        $('p-strip').innerHTML = state.order.map((_, p) => `<i class="${p === s.p ? 'now' : p < s.p ? 'played' : ''}"></i>`).join('');
      };
      // Shrink the section until it fits the TV without scrolling.
      const fitPresent = () => {
        const stage = $('p-stage');
        const lines = stage.querySelector('.p-lines');
        if (!lines) return;
        let size = Math.min(innerWidth * 0.042, 72);
        lines.style.setProperty('--p-size', size + 'px');
        while (stage.scrollHeight > stage.clientHeight + 1 && size > 18) {
          size -= 2;
          lines.style.setProperty('--p-size', size + 'px');
        }
      };

      // ---------- Popovers ----------
      let openPop = null;
      let openTrigger = null;
      const closeAll = () => {
        if (openPop) openPop.dataset.open = 'false';
        if (openTrigger) openTrigger.setAttribute('aria-expanded', 'false');
        $('scrim').dataset.open = 'false';
        const wasOpen = openTrigger;
        openPop = openTrigger = null;
        return wasOpen;
      };
      const toggle = (pop, trigger, placement = 'below') => {
        if (openPop === pop) {
          closeAll()?.focus();
          return;
        }
        closeAll();
        openPop = pop;
        openTrigger = trigger;
        trigger.setAttribute('aria-expanded', 'true');
        $('scrim').dataset.open = 'true';
        if (pop.classList.contains('pop')) {
          const r = trigger.getBoundingClientRect();
          pop.style.visibility = 'hidden';
          pop.style.left = '0px';
          pop.style.top = '0px';
          const w = pop.offsetWidth;
          const h = pop.offsetHeight;
          pop.style.visibility = '';
          let left = r.left + r.width / 2 - w / 2;
          left = Math.min(Math.max(12, left), innerWidth - w - 12);
          const top = placement === 'below' ? r.bottom + 10 : r.top - h - 10;
          pop.style.left = left + 'px';
          pop.style.top = Math.max(12, top) + 'px';
          pop.style.setProperty('--origin', `${r.left + r.width / 2 - left}px ${placement === 'below' ? 0 : h}px`);
        }
        requestAnimationFrame(() => {
          pop.dataset.open = 'true';
          Glass.refresh(pop);
          pop.querySelector('[aria-pressed="true"], button:not(:disabled)')?.focus({ preventScroll: true });
        });
      };

      // ---------- Toast ----------
      let toastTimer;
      const showToast = (text) => {
        $('toast-text').textContent = text;
        $('toast').dataset.open = 'true';
        Glass.refresh($('toast'));
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => ($('toast').dataset.open = 'false'), 1800);
      };

      // ---------- Liquid Glass engine ----------
      // Hybrid. Every browser gets the CSS frosted stack. Chromium (the only engine that accepts an SVG
      // filter in backdrop-filter) also gets bezel refraction: a displacement map derived from Snell's law
      // over a convex-squircle bezel profile, plus a specular rim map.
      // Iterated over archisvaze/liquid-glass:
      //   - maps are cached by size + radius + bezel, so every same-size control shares one <filter>;
      //   - only the bezel band is computed (top/bottom bands fully, middle rows only at the side strips),
      //     about O(r·(w+h)) instead of O(w·h);
      //   - the refraction profile is cached per (thickness, bezel, ior);
      //   - ResizeObserver work is batched into one animation frame;
      //   - the centre stays undisplaced, so text read through the glass stays straight;
      //   - prefers-reduced-transparency drops to an opaque tint; no WebGL, no per-frame work.
      const Glass = (() => {
        const defs = document.getElementById('lg-defs');
        const supported =
          'userAgentData' in navigator &&
          typeof CSS !== 'undefined' &&
          CSS.supports('backdrop-filter', 'url(#lg)') &&
          !matchMedia('(prefers-reduced-transparency: reduce)').matches;
        const SURFACE = (x) => Math.pow(1 - Math.pow(1 - x, 4), 0.25);
        const profiles = new Map();
        const filters = new Map();
        let enabled = false;

        const profileFor = (thickness, bezel, ior) => {
          const key = `${thickness}|${bezel}|${ior}`;
          if (profiles.has(key)) return profiles.get(key);
          const samples = 96;
          const eta = 1 / ior;
          const profile = new Float32Array(samples);
          let maxDisp = 0;
          for (let i = 0; i < samples; i++) {
            const x = i / samples;
            const y = SURFACE(x);
            const dx = x < 1 ? 1e-4 : -1e-4;
            const deriv = (SURFACE(x + dx) - y) / dx;
            const mag = Math.hypot(deriv, 1);
            const nx = -deriv / mag;
            const ny = -1 / mag;
            const k = 1 - eta * eta * (1 - ny * ny);
            if (k < 0) continue;
            const sq = Math.sqrt(k);
            const rx = -(eta * ny + sq) * nx;
            const ry = eta - (eta * ny + sq) * ny;
            profile[i] = rx * ((y * bezel + thickness) / ry);
            maxDisp = Math.max(maxDisp, Math.abs(profile[i]));
          }
          const out = { profile, maxDisp: maxDisp || 1 };
          profiles.set(key, out);
          return out;
        };

        const makeMaps = (w, h, r, bezel, profile, maxDisp) => {
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          const disp = ctx.createImageData(w, h);
          new Uint32Array(disp.data.buffer).fill(0xff008080); // neutral: R=128 G=128 B=0 A=255
          const spec = ctx.createImageData(w, h);
          const dd = disp.data;
          const sd = spec.data;
          const rSq = r * r;
          const r1Sq = (r + 1) * (r + 1);
          const rBSq = Math.max(r - bezel, 0) ** 2;
          const wB = w - 2 * r;
          const hB = h - 2 * r;
          const S = profile.length;
          const specBezel = bezel * 2.5;
          const lx = Math.cos(Math.PI / 3);
          const ly = Math.sin(Math.PI / 3);

          const px = (x1, y1) => {
            const x = x1 < r ? x1 - r : x1 >= w - r ? x1 - r - wB : 0;
            const y = y1 < r ? y1 - r : y1 >= h - r ? y1 - r - hB : 0;
            const dSq = x * x + y * y;
            if (dSq > r1Sq) return;
            const dist = Math.sqrt(dSq);
            if (dist === 0) return;
            const op = dSq < rSq ? 1 : 1 - (dist - r) / (Math.sqrt(r1Sq) - r);
            if (op <= 0) return;
            const fromSide = r - dist;
            const cos = x / dist;
            const sin = y / dist;
            const idx = (y1 * w + x1) * 4;
            if (dSq >= rBSq) {
              const disp = profile[Math.min(((fromSide / bezel) * S) | 0, S - 1)] || 0;
              dd[idx] = (128 + ((-cos * disp) / maxDisp) * 127 * op + 0.5) | 0;
              dd[idx + 1] = (128 + ((-sin * disp) / maxDisp) * 127 * op + 0.5) | 0;
            }
            if (fromSide < specBezel) {
              const dot = Math.abs(cos * lx - sin * ly);
              const edge = Math.sqrt(Math.max(0, 1 - (1 - Math.max(fromSide, 0)) ** 2));
              const c = dot * edge;
              const col = (255 * c) | 0;
              sd[idx] = sd[idx + 1] = sd[idx + 2] = col;
              sd[idx + 3] = (col * c * op) | 0;
            }
          };

          const band = Math.ceil(Math.max(r, specBezel)) + 1;
          for (let y1 = 0; y1 < h; y1++) {
            if (y1 < band || y1 >= h - band) {
              for (let x1 = 0; x1 < w; x1++) px(x1, y1);
            } else {
              const edge = Math.min(band, w);
              for (let x1 = 0; x1 < edge; x1++) px(x1, y1);
              for (let x1 = Math.max(w - band, edge); x1 < w; x1++) px(x1, y1);
            }
          }
          ctx.putImageData(disp, 0, 0);
          const dispUrl = canvas.toDataURL();
          ctx.putImageData(spec, 0, 0);
          return { dispUrl, specUrl: canvas.toDataURL() };
        };

        const filterFor = (w, h, r, bezel, blur) => {
          const key = `${w}x${h}r${r}b${bezel}s${blur}`;
          if (filters.has(key)) return filters.get(key);
          const id = `lg-${filters.size}`;
          const { profile, maxDisp } = profileFor(36, bezel, 1.5);
          const { dispUrl, specUrl } = makeMaps(w, h, r, bezel, profile, maxDisp);
          defs.insertAdjacentHTML(
            'beforeend',
            `<filter id="${id}" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
              <feGaussianBlur in="SourceGraphic" stdDeviation="${blur}" result="b"/>
              <feImage href="${dispUrl}" x="0" y="0" width="${w}" height="${h}" result="d"/>
              <feDisplacementMap in="b" in2="d" scale="${maxDisp}" xChannelSelector="R" yChannelSelector="G" result="r"/>
              <feColorMatrix in="r" type="saturate" values="1.8" result="rs"/>
              <feImage href="${specUrl}" x="0" y="0" width="${w}" height="${h}" result="s"/>
              <feComposite in="rs" in2="s" operator="in" result="sm"/>
              <feComponentTransfer in="s" result="sf"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
              <feBlend in="sm" in2="rs" mode="normal" result="w"/>
              <feBlend in="sf" in2="w" mode="normal"/>
            </filter>`
          );
          filters.set(key, id);
          return id;
        };

        const apply = (el) => {
          if (!enabled) return;
          const w = el.offsetWidth;
          const h = el.offsetHeight;
          if (w < 4 || h < 4) return;
          const cs = getComputedStyle(el);
          const r = Math.floor(Math.min(parseFloat(cs.borderTopLeftRadius) || 0, w / 2, h / 2));
          if (r < 3) return;
          const bezel = Math.max(1, Math.min(Number(el.dataset.bezel) || Math.round(r * 0.6), 18, r - 1));
          const blur = Number(el.dataset.blur ?? 3);
          el.style.setProperty('--lg', `url(#${filterFor(w, h, r, bezel, blur)})`);
        };

        const pending = new Set();
        let frame = 0;
        const flush = () => {
          frame = 0;
          pending.forEach(apply);
          pending.clear();
        };
        const queue = (el) => {
          pending.add(el);
          clearTimeout(frame);
          frame = setTimeout(() => requestAnimationFrame(flush), 90);
        };
        const ro = typeof ResizeObserver === 'undefined' ? null : new ResizeObserver((entries) => entries.forEach((e) => queue(e.target)));
        const watch = (el) => {
          ro?.observe(el);
          queue(el);
        };
        document.querySelectorAll('[data-glass]').forEach(watch);

        return {
          supported,
          watch,
          refresh: (el) => queue(el),
          enable(on) {
            enabled = Boolean(on && supported);
            document.documentElement.classList.toggle('refract', enabled);
            if (enabled) document.querySelectorAll('[data-glass]').forEach(queue);
          },
        };
      })();

      // ---------- Wiring ----------
      const scrollPage = (d) => {
        const el = scroller();
        const h = el === document.scrollingElement ? innerHeight : el.clientHeight;
        el.scrollBy({ top: d * h * 0.8, behavior: reduced() ? 'auto' : 'smooth' });
      };

      // One click handler for every [data-action], [data-seg], [data-jump], [data-go] and [data-pick].
      document.addEventListener('click', (e) => {
        const seg = e.target.closest('button[data-seg]');
        if (seg && !seg.closest('.ghost')) {
          state[seg.dataset.seg] = seg.dataset.value;
          store.set(seg.dataset.seg, seg.dataset.value);
          render();
          return;
        }
        const jump = e.target.closest('[data-jump]');
        if (jump && !jump.closest('.ghost')) {
          $(jump.dataset.jump)?.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
          return;
        }
        const goBtn = e.target.closest('[data-go]');
        if (goBtn) {
          const p = Number(goBtn.dataset.go);
          if (inSplit() && p === state.pos + 1 && state.pin === null) {
            closeAll();
            advance(1);
          } else go(p);
          return;
        }
        const pick = e.target.closest('[data-pick]');
        if (pick) {
          const v = pick.dataset.pick;
          if (pickSide === 'right') {
            const si = v === 'follow' ? null : Number(v);
            state.pin = si === null || si === nextNatural() ? null : si;
            closeAll();
            render();
          } else go(state.order.indexOf(Number(v)));
          return;
        }
        const root = e.target.closest('#key-grid button[data-root]');
        if (root) {
          state.chosen[cur()] = Number(root.dataset.root);
          render();
          closeAll()?.focus();
          return;
        }
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const a = el.dataset.action;
        if (a === 'next') advance(1);
        else if (a === 'prev') advance(-1);
        else if (a === 'list') {
          renderList();
          toggle($('sheet-list'), $('spectrum-btn'));
        } else if (a === 'close') closeAll()?.focus();
        else if (a === 'edit-order') {
          state.editing = !state.editing;
          renderList();
        } else if (a === 'reset-order') {
          const si = cur();
          state.order = identity.slice();
          state.pos = state.order.indexOf(si);
          store.set('order', null);
          render();
        } else if (a === 'key') toggle($('key-pop'), el);
        else if (a === 'info') toggle($('info-pop'), el);
        else if (a === 'pick') openPick(el.dataset.side, el);
        else if (a === 'copy') {
          closeAll();
          navigator.clipboard?.writeText(location.href).catch(() => {});
          showToast(t('linkCopied'));
        } else if (a === 'present') openPresent();
        else if (a === 'smaller' || a === 'larger') {
          state.size = Math.min(SIZES.length - 1, Math.max(0, state.size + (a === 'larger' ? 1 : -1)));
          store.set('size', state.size);
          applyPrefs();
        } else if (a === 'auto-toggle') setAuto(!state.auto);
        else if (a === 'auto-slower' || a === 'auto-faster') {
          state.speed = Math.min(SPEEDS.length - 1, Math.max(0, state.speed + (a === 'auto-faster' ? 1 : -1)));
          store.set('speed', state.speed);
          renderAuto();
        } else if (a === 'auto-close') {
          state.autoShown = false;
          setAuto(false);
        } else if (a === 'split-toggle') {
          state.split = !state.split;
          store.set('split', state.split);
          applyPrefs();
          render();
        } else if (a === 'refract-toggle') {
          state.refract = !state.refract;
          store.set('refract', state.refract);
          applyPrefs();
        } else if (a === 'p-exit') closePresent();
        else if (a === 'p-chords') {
          P.chords = !P.chords;
          store.set('presentChords', P.chords);
          renderPresent();
        }
      });

      const bindSeg = (id, onPick) =>
        $(id).addEventListener('click', (e) => {
          const b = e.target.closest('button[data-value]');
          if (b) onPick(b.dataset.value);
        });
      bindSeg('theme-seg', (v) => {
        state.theme = v;
        store.set('theme', v);
        applyPrefs();
      });
      bindSeg('lang-seg', (v) => {
        state.lang = v;
        store.set('lang', v);
        renderStatic();
        render();
        applyPrefs();
        requestAnimationFrame(() => document.querySelectorAll('[data-glass]').forEach(Glass.refresh));
      });

      $('view-btn').onclick = () => toggle($('view-pop'), $('view-btn'));
      $('read-btn').onclick = () => toggle($('read-pop'), $('read-btn'), 'above');
      $('signin').onclick = () => showToast(t('signInMock'));
      $('scrim').onclick = () => closeAll();

      // Present: tap the right two thirds to go on, the left third to go back.
      $('p-stage').addEventListener('click', (e) => stepPresent(e.clientX > innerWidth / 3 ? 1 : -1));
      let ctrlTimer;
      $('present').addEventListener('pointermove', () => {
        $('present').classList.add('ctrls');
        clearTimeout(ctrlTimer);
        ctrlTimer = setTimeout(() => $('present').classList.remove('ctrls'), 2200);
      });
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && !$('present').hidden) closePresent();
      });

      // Keyboard and Bluetooth page-turner pedals.
      const isTyping = (el) => el instanceof HTMLElement && (el.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName));
      addEventListener('keydown', (e) => {
        if (e.altKey || e.ctrlKey || e.metaKey || isTyping(e.target)) return;
        if (!$('present').hidden) {
          if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) {
            e.preventDefault();
            stepPresent(1);
          } else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) {
            e.preventDefault();
            stepPresent(-1);
          } else if (e.key === 'Escape') closePresent();
          else if (e.key.toLowerCase() === 'c') {
            P.chords = !P.chords;
            store.set('presentChords', P.chords);
            renderPresent();
          }
          return;
        }
        if (e.key === 'Escape' && openPop) {
          closeAll()?.focus();
          return;
        }
        if (openPop) return;
        if (state.auto && ![' ', 'ArrowRight', 'ArrowLeft'].includes(e.key)) setAuto(false);
        if (e.key === 'ArrowRight') advance(1);
        else if (e.key === 'ArrowLeft') advance(-1);
        else if (e.key === 'PageDown' || (e.key === ' ' && !(e.target instanceof HTMLButtonElement))) {
          e.preventDefault();
          scrollPage(1);
        } else if (e.key === 'PageUp') {
          e.preventDefault();
          scrollPage(-1);
        } else if (e.key.toLowerCase() === 'p') openPresent();
      });

      // Swipe between songs: a hidden gesture, horizontal and quick.
      let touch = null;
      $('reader').addEventListener(
        'touchstart',
        (e) => {
          const p = e.touches[0];
          touch = { x: p.clientX, y: p.clientY, t: Date.now() };
          if (state.auto) setAuto(false);
        },
        { passive: true }
      );
      $('reader').addEventListener(
        'touchend',
        (e) => {
          if (!touch) return;
          const p = e.changedTouches[0];
          const dx = p.clientX - touch.x;
          const dy = p.clientY - touch.y;
          if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2 && Date.now() - touch.t < 600) advance(dx < 0 ? 1 : -1);
          touch = null;
        },
        { passive: true }
      );
      addEventListener('wheel', () => state.auto && setAuto(false), { passive: true });

      // Reorder: drag the pixel grip, or focus it and use the arrow keys.
      let drag = null;
      const commitOrder = () => {
        const si = cur();
        state.order = [...$('sheet-rows').children].map((li) => Number(li.dataset.song));
        state.pos = state.order.indexOf(si);
        state.pin = null;
        store.set('order', isCustomOrder() ? state.order : null);
        render();
      };
      $('sheet-rows').addEventListener('pointerdown', (e) => {
        const grip = e.target.closest('[data-grip]');
        if (!grip) return;
        drag = grip.closest('li');
        drag.classList.add('dragging');
        grip.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      $('sheet-rows').addEventListener('pointermove', (e) => {
        if (!drag) return;
        const list = $('sheet-rows');
        for (const li of list.children) {
          if (li === drag) continue;
          const r = li.getBoundingClientRect();
          if (e.clientY < r.top + r.height / 2) {
            if (drag.nextElementSibling !== li) list.insertBefore(drag, li);
            return;
          }
        }
        list.appendChild(drag);
      });
      const endDrag = () => {
        if (!drag) return;
        drag.classList.remove('dragging');
        drag = null;
        commitOrder();
      };
      $('sheet-rows').addEventListener('pointerup', endDrag);
      $('sheet-rows').addEventListener('pointercancel', endDrag);
      $('sheet-rows').addEventListener('keydown', (e) => {
        const grip = e.target.closest('[data-grip]');
        if (!grip || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
        e.preventDefault();
        const li = grip.closest('li');
        const si = li.dataset.song;
        if (e.key === 'ArrowUp' && li.previousElementSibling) li.parentNode.insertBefore(li, li.previousElementSibling);
        if (e.key === 'ArrowDown' && li.nextElementSibling) li.parentNode.insertBefore(li.nextElementSibling, li);
        commitOrder();
        $('sheet-rows').querySelector(`li[data-song="${si}"] [data-grip]`)?.focus();
      });

      // While reading downward the dock gathers into the strip; scrolling up or reaching the end restores it.
      let lastY = scrollY;
      addEventListener(
        'scroll',
        () => {
          if (inSplit()) return;
          const y = scrollY;
          const root = document.documentElement;
          root.classList.toggle('away-top', y > 4);
          const named = root.classList.contains('named');
          if (y > 160 && y - lastY > 6 && !openPop && !named) root.classList.add('dock-min');
          else if (lastY - y > 6 || named || y < 160) root.classList.remove('dock-min');
          lastY = y;
        },
        { passive: true }
      );

      let wasSplit = inSplit();
      const onLayoutChange = () => {
        applyPrefs();
        if (inSplit() !== wasSplit) {
          wasSplit = inSplit();
          setAuto(false);
          render();
          if (!wasSplit) scrollTo({ top: 0, behavior: 'instant' });
        } else {
          syncSeg('mode-seg', state.mode);
          syncSeg('notation-seg', state.notation);
          $('scroll-view').classList.toggle('two-col', innerWidth >= 1280);
        }
        if (!$('present').hidden) renderPresent();
      };
      addEventListener('resize', onLayoutChange);
      splitMQ.addEventListener('change', onLayoutChange);
      matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyPrefs);
      document.addEventListener('visibilitychange', requestWake);

      renderStatic();
      applyPrefs();
      render();
      requestWake();
      document.fonts?.ready.then(() => {
        syncSeg('mode-seg', state.mode);
        syncSeg('notation-seg', state.notation);
        syncSeg('theme-seg', state.theme);
        syncSeg('lang-seg', state.lang);
      });
    </script>
  </body>
</html>
