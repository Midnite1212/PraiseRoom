<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Public Setlist View</title>
    <meta
      name="description"
      content="Design mock: the Praise Room public setlist view in the Liquid Glass and pixel icon world."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Design mock only. Sample songs are public-domain hymns plus one synthetic Chinese demo song.
      Icons: pixelarticons 2.4.1 by Gerrit Halfmann, MIT licence (https://github.com/halfmage/pixelarticons).
      Glass: CSS backdrop-filter in every browser; Chromium adds bezel refraction from size-specific
      SVG displacement maps (Snell's-law profile, after archisvaze/liquid-glass and kube.io).
    -->
    <style>
      :root {
        /* The one brand hue. Every tint, chord and pixel of light derives from it. */
        --h: 250;
        --font-ui: 'Geist', ui-sans-serif, system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC',
          'Microsoft JhengHei', sans-serif;
        --font-display: var(--font-ui);
        /* Musical data only (chords, keys, offsets, counts): every chord takes the same width over its syllable. */
        --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC',
          monospace;
        --lyrics-size: 1.125rem;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-liquid: cubic-bezier(0.34, 1.32, 0.52, 1);
        --dock-h: 64px;
        --bar-h: 56px;
        --gutter: 16px;

        color-scheme: dark;
      }

      /* Dark is the default: dim rooms and stages. Every colour is tinted by the one brand hue. */
      :root,
      :root[data-theme='dark'] {
        --ground: oklch(0.165 0.013 var(--h));
        --ink: oklch(0.96 0.01 var(--h));
        --ink-2: oklch(0.79 0.025 var(--h));
        --ink-3: oklch(0.64 0.03 var(--h));
        --chord: oklch(0.84 0.13 var(--h));
        --label: oklch(0.77 0.1 var(--h));
        --hairline: oklch(1 0 0 / 0.1);
        --glass-tint: oklch(0.25 0.02 var(--h) / 0.56);
        --glass-tint-strong: oklch(0.21 0.026 var(--h) / 0.8);
        --glass-tint-over: oklch(0.22 0.02 var(--h) / 0.72);
        --rim-hi: oklch(1 0 0 / 0.55);
        --rim-lo: oklch(1 0 0 / 0.07);
        --rim-edge: oklch(1 0 0 / 0.06);
        --shadow: oklch(0.06 0.02 var(--h) / 0.6);
        --fill-hover: oklch(1 0 0 / 0.08);
        --fill-press: oklch(1 0 0 / 0.14);
        --fill-on: oklch(0.84 0.13 var(--h) / 0.22);
        --ground-lift: oklch(0.215 0.03 var(--h));
        --pixel-off: oklch(1 0 0 / 0.16);
        --pixel-played: oklch(0.8 0.12 var(--h) / 0.55);
        --pixel-on: oklch(0.86 0.13 var(--h));
        --pixel-glow: oklch(0.8 0.15 var(--h) / 0.7);
        color-scheme: dark;
      }

      :root[data-theme='light'] {
        --ground: oklch(0.97 0.008 var(--h));
        --ink: oklch(0.21 0.03 var(--h));
        --ink-2: oklch(0.41 0.035 var(--h));
        --ink-3: oklch(0.51 0.035 var(--h));
        --chord: oklch(0.5 0.16 var(--h));
        --label: oklch(0.5 0.12 var(--h));
        --hairline: oklch(0.25 0.03 var(--h) / 0.12);
        --glass-tint: oklch(0.995 0.006 var(--h) / 0.55);
        --glass-tint-strong: oklch(0.99 0.008 var(--h) / 0.84);
        --glass-tint-over: oklch(0.99 0.006 var(--h) / 0.72);
        --rim-hi: oklch(1 0 0 / 0.95);
        --rim-lo: oklch(1 0 0 / 0.3);
        --rim-edge: oklch(0.25 0.03 var(--h) / 0.1);
        --shadow: oklch(0.32 0.05 var(--h) / 0.24);
        --fill-hover: oklch(0.25 0.03 var(--h) / 0.07);
        --fill-press: oklch(0.25 0.03 var(--h) / 0.12);
        --fill-on: oklch(0.5 0.16 var(--h) / 0.14);
        --ground-lift: oklch(0.93 0.022 var(--h));
        --pixel-off: oklch(0.25 0.03 var(--h) / 0.16);
        --pixel-played: oklch(0.55 0.14 var(--h) / 0.5);
        --pixel-on: oklch(0.55 0.16 var(--h));
        --pixel-glow: oklch(0.55 0.16 var(--h) / 0.4);
        color-scheme: light;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        scrollbar-color: oklch(0.6 0.05 var(--h) / 0.5) transparent;
        scroll-padding-top: calc(var(--bar-h) + 24px);
      }

      body {
        margin: 0;
        min-height: 100svh;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: 1rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      ::selection {
        background: oklch(0.84 0.13 var(--h) / 0.35);
        color: var(--ink);
      }

      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      button:disabled {
        cursor: default;
        opacity: 0.38;
      }

      :focus-visible {
        outline: 2px solid var(--chord);
        outline-offset: 2px;
      }

      [hidden] {
        display: none !important;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* Pixel icons are a 24-unit grid, drawn mostly in 2-unit pixels. At 1x, 24px puts every edge on a
         device pixel. Smaller sizes keep each icon pixel a whole number of device pixels wide (3 at 18px
         on 2x, 5 at 20px on 3x); edges at odd units fall on half pixels, and crispEdges snaps them. */
      :root {
        --icon: 24px;
      }

      @media (min-resolution: 2dppx) {
        :root {
          --icon: 18px;
        }
      }

      @media (min-resolution: 2.5dppx) {
        :root {
          --icon: 20px;
        }
      }

      .px {
        display: block;
        width: var(--icon);
        height: var(--icon);
        flex: none;
        shape-rendering: crispEdges;
      }

      /* ---------- Ground: one even field, lifted by a single soft wash of light from the top ---------- */

      .ground-wash {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(180deg, var(--ground-lift) 0%, transparent 46vh);
      }

      /* Scroll edges: content dissolves before it reaches the floating bars. */
      .edge {
        position: fixed;
        left: 0;
        right: 0;
        z-index: 20;
        pointer-events: none;
        background: color-mix(in oklch, var(--ground) 55%, transparent);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        transition: opacity 240ms var(--ease-out);
      }

      .edge--top {
        top: 0;
        height: calc(max(10px, env(safe-area-inset-top)) + var(--bar-h) + 22px);
        -webkit-mask-image: linear-gradient(#000 55%, transparent);
        mask-image: linear-gradient(#000 55%, transparent);
        opacity: 0;
      }

      .away-top .edge--top {
        opacity: 1;
      }

      .edge--bottom {
        bottom: 0;
        height: calc(max(12px, env(safe-area-inset-bottom)) + var(--dock-h) + 28px);
        -webkit-mask-image: linear-gradient(transparent, #000 50%);
        mask-image: linear-gradient(transparent, #000 50%);
      }

      /* ---------- Liquid Glass ---------- */
      /*
        Layering (same in both paths): the host is an isolated stacking context with no paint of its own.
        ::after (z -1) carries the backdrop and the tint, ::before (z 1) is the specular rim, children sit between.
        Frosted path: backdrop-filter blur + saturate, everywhere.
        Refraction path (.refract on <html>, Chromium only): ::after swaps to the element's SVG filter.
      */
      .glass {
        position: relative;
        isolation: isolate;
        border-radius: var(--glass-r, 999px);
        color: var(--ink);
        box-shadow:
          0 12px 32px -10px var(--shadow),
          0 2px 8px -2px var(--shadow);
      }

      .glass::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        background: var(--glass-fill, var(--glass-tint));
        -webkit-backdrop-filter: blur(var(--glass-blur, 14px)) saturate(185%) brightness(1.04);
        backdrop-filter: blur(var(--glass-blur, 14px)) saturate(185%) brightness(1.04);
        pointer-events: none;
      }

      .glass::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        border-radius: inherit;
        padding: 1px;
        background:
          linear-gradient(
            150deg,
            var(--rim-hi) 0%,
            var(--rim-lo) 28%,
            transparent 50%,
            var(--rim-lo) 74%,
            color-mix(in oklch, var(--rim-hi) 60%, transparent) 100%
          ),
          linear-gradient(var(--rim-edge), var(--rim-edge));
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
        pointer-events: none;
      }

      .refract .glass::after {
        -webkit-backdrop-filter: var(--lg, blur(var(--glass-blur, 14px)) saturate(185%));
        backdrop-filter: var(--lg, blur(var(--glass-blur, 14px)) saturate(185%));
      }

      /* Glass that floats over moving lyrics carries a denser tint so its own labels always win. */
      .dock,
      .scrolled .topbar {
        --glass-fill: var(--glass-tint-over);
      }

      .glass::after {
        transition: background-color 300ms var(--ease-out);
      }

      .glass--strong {
        --glass-fill: var(--glass-tint-strong);
        --glass-blur: 22px;
      }

      @media (prefers-reduced-transparency: reduce) {
        .glass::after,
        .refract .glass::after {
          background: var(--glass-tint-strong);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
        .glass::after {
          background: color-mix(in oklch, var(--glass-tint-strong) 100%, var(--ground));
        }
      }

      @media (forced-colors: active) {
        .glass {
          border: 1px solid CanvasText;
        }
      }

      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .glass::after {
          background: var(--glass-tint-strong);
        }
      }

      /* Plain controls inside glass: no glass-in-glass, just fills. */
      .tap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 40px;
        height: 40px;
        padding: 0 8px;
        border-radius: 999px;
        transition:
          background-color 180ms var(--ease-out),
          transform 260ms var(--ease-liquid);
      }

      .tap:hover:not(:disabled) {
        background: var(--fill-hover);
      }

      .tap:active:not(:disabled) {
        background: var(--fill-press);
        transform: scale(0.94);
      }

      /* ---------- Top bar ---------- */

      .topbar {
        position: fixed;
        z-index: 30;
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        height: var(--bar-h);
        max-width: 1200px;
        margin-inline: auto;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px 0 10px;
      }

      .mark {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        color: var(--chord);
      }

      .mark svg {
        width: 24px;
        height: 24px;
        shape-rendering: crispEdges;
      }

      .bar-title {
        position: relative;
        flex: 1;
        min-width: 0;
        height: 40px;
        margin-left: 2px;
      }

      .bar-title > div {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        transition:
          opacity 260ms var(--ease-out),
          transform 360ms var(--ease-out);
      }

      .bar-title strong,
      .bar-title span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-weight: 400;
      }

      .bar-title strong {
        font-size: 0.9375rem;
        font-weight: 600;
        line-height: 1.2;
      }

      .bar-title span {
        font-size: 0.8125rem;
        line-height: 1.3;
        color: var(--ink-2);
      }

      .bar-title .song-mode {
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
      }

      .bar-title .song-mode strong {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .scrolled .bar-title .set-mode {
        opacity: 0;
        transform: translateY(-8px);
      }

      .scrolled .bar-title .song-mode {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        height: 22px;
        padding: 0 8px;
        border-radius: 6px;
        background: var(--fill-on);
        color: var(--chord);
        font-size: 0.8125rem;
        font-weight: 600;
        font-family: var(--font-mono);
        white-space: nowrap;
      }

      .bar-actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .signin {
        height: 40px;
        margin-left: 4px;
        padding: 0 14px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--ground);
        font-weight: 600;
        font-size: 0.875rem;
        white-space: nowrap;
        transition: transform 260ms var(--ease-liquid);
      }

      .signin:active {
        transform: scale(0.95);
      }

      /* Song rows: shared by the desktop rail and the phone sheet. */
      .song-row {
        display: grid;
        grid-template-columns: 12px 20px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 44px;
        padding: 6px 10px;
        border-radius: 14px;
        text-align: left;
        transition: background-color 180ms var(--ease-out);
      }

      .song-row:hover {
        background: var(--fill-hover);
      }

      .song-row[aria-current='true'] {
        background: var(--row-on);
      }

      .song-row .pixel {
        width: 10px;
        height: 10px;
        background: var(--pixel-off);
      }

      .song-row .pixel.played {
        background: var(--pixel-played);
      }

      .song-row[aria-current='true'] .pixel {
        background: var(--pixel-on);
      }

      .song-row .num {
        color: var(--ink-3);
        font-size: 0.8125rem;
        font-family: var(--font-mono);
      }

      .song-row .title {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 0.9375rem;
        font-weight: 400;
      }

      .song-row[aria-current='true'] .title {
        font-weight: 600;
      }

      .song-row .key {
        color: var(--ink-2);
        font-size: 0.8125rem;
        font-weight: 600;
        font-family: var(--font-mono);
      }

      .song-row {
        --row-on: var(--fill-on);
      }

      /* ---------- Reader ---------- */

      .reader {
        min-width: 0;
      }

      .reader-inner {
        max-width: 72ch;
      }

      .two-col .reader-inner {
        max-width: none;
      }

      .song-head {
        margin-bottom: 24px;
      }

      .title-row {
        --title-size: clamp(2.125rem, 1.4rem + 3.4vw, 3.5rem);
        display: flex;
        align-items: flex-start;
        gap: 4px;
      }

      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: var(--title-size);
        font-weight: 700;
        line-height: 1.04;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      /* Geist centres its caps in the line box, so the 40px button centres on the title's first line:
         half the 1.04 line height (less 0.02em measured), minus half the button. */
      .title-row .tap {
        flex: none;
        margin-top: calc(var(--title-size) * 0.5 - 20px);
        color: var(--ink-3);
      }

      .artist {
        margin: 8px 0 0;
        color: var(--ink-2);
        font-size: 1.0625rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 22px;
      }

      .controls .glass {
        --glass-blur: 10px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        padding: 2px;
      }

      .key-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 10px 0 14px;
        border-radius: 999px;
        transition: transform 260ms var(--ease-liquid);
      }

      .key-btn:active {
        transform: scale(0.95);
      }

      .key-btn .k-label {
        color: var(--ink-2);
        font-size: 0.8125rem;
      }

      .key-btn .k-name {
        font-size: 1.0625rem;
        font-weight: 700;
        font-family: var(--font-mono);
        min-width: 1.6em;
      }

      .offset {
        display: inline-grid;
        place-items: center;
        min-width: 28px;
        height: 22px;
        padding: 0 6px;
        border-radius: 6px;
        background: var(--fill-on);
        color: var(--chord);
        font-size: 0.75rem;
        font-weight: 700;
        font-family: var(--font-mono);
      }

      .offset[data-zero='true'] {
        background: var(--fill-hover);
        color: var(--ink-3);
      }

      /* Segmented control with a liquid thumb. */
      .seg {
        position: relative;
        display: inline-grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
      }

      .seg button {
        position: relative;
        z-index: 1;
        height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        color: var(--ink-2);
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
        transition: color 220ms var(--ease-out);
      }

      .seg button[aria-pressed='true'] {
        color: var(--ink);
      }

      .seg .thumb {
        position: absolute;
        z-index: 0;
        top: 0;
        bottom: 0;
        left: 0;
        border-radius: 999px;
        background: var(--fill-on);
        box-shadow: inset 0 0 0 1px oklch(0.84 0.13 var(--h) / 0.25);
        transition:
          transform 520ms var(--ease-liquid),
          width 520ms var(--ease-liquid);
      }

      .seg.nums button {
        font-family: var(--font-mono);
      }

      .size-btn {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.9375rem;
        display: grid;
        place-items: center;
      }

      .size-btn:hover,
      .key-btn:hover {
        background: var(--fill-hover);
      }

      /* ---------- Lyrics ---------- */

      .lyrics {
        font-size: var(--lyrics-size);
        line-height: 1.45;
        transition: font-size 260ms var(--ease-out);
      }

      .two-col .lyrics {
        columns: 2;
        column-gap: 56px;
      }

      .lyrics section {
        break-inside: avoid;
        margin-bottom: 1.6em;
      }

      .lyrics h3 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 0.6em;
        color: var(--label);
        font-family: var(--font-ui);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        line-height: 1;
      }

      .lyrics h3::before {
        content: '';
        width: 6px;
        height: 6px;
        background: currentColor;
      }

      .line {
        margin: 0;
      }

      .chords-on .line + .line {
        margin-top: 0.35em;
      }

      .line.has-chords {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
      }

      .seg-word {
        display: inline-flex;
        flex-direction: column;
      }

      .ch {
        min-height: 1.3em;
        padding-right: 0.4em;
        color: var(--chord);
        font-weight: 600;
        line-height: 1.3;
        font-family: var(--font-mono);
      }

      .ch sup {
        font-size: 0.68em;
        vertical-align: 0.5em;
        line-height: 0;
      }

      .ly {
        white-space: pre;
      }

      .line.plain {
        white-space: pre-wrap;
      }

      .gap {
        height: 0.8em;
      }

      .no-lyrics {
        color: var(--ink-2);
      }

      /* Song swap: the sheet slides a little in the direction of travel. */
      .reader-inner.enter-next {
        animation: in-next 520ms var(--ease-out) both;
      }

      .reader-inner.enter-prev {
        animation: in-prev 520ms var(--ease-out) both;
      }

      @keyframes in-next {
        from {
          opacity: 0;
          transform: translateX(28px);
          filter: blur(6px);
        }
      }

      @keyframes in-prev {
        from {
          opacity: 0;
          transform: translateX(-28px);
          filter: blur(6px);
        }
      }

      /* ---------- Next up ---------- */

      .next-up {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        width: 100%;
        margin-top: 40px;
        padding: 22px 4px;
        border-top: 1px solid var(--hairline);
        text-align: left;
        border-radius: 0;
      }

      .next-up .pixel {
        width: 14px;
        height: 14px;
        background: var(--pixel-played);
      }

      .next-up small {
        display: block;
        color: var(--ink-3);
        font-size: 0.8125rem;
      }

      .next-up strong {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-family: var(--font-display);
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .next-up .go {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-2);
        font-weight: 600;
        font-family: var(--font-mono);
        transition: transform 300ms var(--ease-liquid);
      }

      .next-up:hover .go {
        transform: translateX(4px);
        color: var(--ink);
      }

      .end-set {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 40px;
        padding: 22px 4px;
        border-top: 1px solid var(--hairline);
        color: var(--ink-2);
      }

      .end-set .row {
        display: flex;
        gap: 4px;
      }

      .end-set .row i {
        width: 8px;
        height: 8px;
        background: var(--pixel-on);
      }

      .credit {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 28px;
        color: var(--ink-3);
        font-size: 0.8125rem;
        font-weight: 400;
      }

      .credit svg {
        width: 12px;
        height: 12px;
        color: var(--chord);
        shape-rendering: crispEdges;
      }

      /* ---------- Dock ---------- */

      .dock {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: min(calc(100% - 20px), 460px);
        height: var(--dock-h);
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr) 52px;
        align-items: center;
        padding: 0 6px;
        --glass-blur: 16px;
      }

      .dock .tap {
        width: 52px;
        height: 52px;
        transition:
          background-color 180ms var(--ease-out),
          transform 260ms var(--ease-liquid),
          opacity 200ms var(--ease-out);
      }

      /* While reading downward the dock gathers into the spectrum alone; scrolling up restores it. */
      .dock {
        transition:
          width 560ms var(--ease-liquid),
          height 560ms var(--ease-liquid),
          left 560ms var(--ease-out);
      }

      .dock-min .dock {
        width: var(--dock-min-w, 140px);
        height: 44px;
        grid-template-columns: 0 minmax(0, 1fr) 0;
        padding: 0;
      }

      .dock-min .dock .tap {
        opacity: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .dock-label {
        transition: opacity 200ms var(--ease-out);
      }

      .dock-min .dock-label {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .dock-min .spectrum-btn {
        height: 44px;
      }

      .spectrum-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 52px;
        min-width: 0;
        padding: 0 8px;
        border-radius: 22px;
        transition: background-color 180ms var(--ease-out);
      }

      .spectrum-btn:hover {
        background: var(--fill-hover);
      }

      .spectrum {
        position: relative;
        display: flex;
        gap: var(--px-gap, 5px);
        padding: 0 2px;
      }

      .spectrum i {
        width: var(--px, 10px);
        height: var(--px, 10px);
        background: var(--pixel-off);
        transition:
          background-color 600ms var(--ease-out),
          box-shadow 600ms var(--ease-out);
      }

      .spectrum i.played {
        background: var(--pixel-played);
      }

      .spectrum i.now {
        background: var(--pixel-on);
        box-shadow: 0 2px 10px 1px var(--pixel-glow);
      }

      /* The lens: a small glass bead that rides along the spectrum to the current song. */
      .lens {
        --glass-r: 7px;
        --glass-fill: transparent;
        position: absolute;
        top: calc((var(--px, 10px) - var(--lens)) / 2);
        left: 0;
        width: var(--lens);
        height: var(--lens);
        --lens: calc(var(--px, 10px) + 10px);
        box-shadow: 0 3px 8px -2px var(--shadow);
        transition: transform 640ms var(--ease-liquid);
        pointer-events: none;
      }

      .lens::after {
        -webkit-backdrop-filter: brightness(1.28) saturate(1.7);
        backdrop-filter: brightness(1.28) saturate(1.7);
      }

      .dock-label {
        display: flex;
        align-items: baseline;
        gap: 8px;
        max-width: 100%;
        min-width: 0;
        font-size: 0.9375rem;
        line-height: 1.1;
      }

      .dock-label .count {
        color: var(--ink-3);
        font-family: var(--font-mono);
        flex: none;
      }

      .dock-label .name {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-weight: 600;
      }

      /* ---------- Popovers and sheet ---------- */

      .pop {
        --glass-r: 22px;
        position: fixed;
        z-index: 50;
        min-width: 220px;
        padding: 14px;
        opacity: 0;
        visibility: hidden;
        transform: scale(0.94);
        transform-origin: var(--origin, top right);
        transition:
          opacity 200ms var(--ease-out),
          transform 360ms var(--ease-liquid),
          visibility 0s linear 360ms;
      }

      .pop[data-open='true'] {
        opacity: 1;
        visibility: visible;
        transform: none;
        transition:
          opacity 160ms var(--ease-out),
          transform 420ms var(--ease-liquid),
          visibility 0s;
      }

      .pop h2 {
        margin: 0 0 10px;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--ink-2);
      }

      .pop .group + .group {
        margin-top: 16px;
      }

      .key-grid {
        display: grid;
        grid-template-columns: repeat(4, 52px);
        gap: 4px;
      }

      .key-grid button {
        position: relative;
        height: 44px;
        border-radius: 12px;
        font-weight: 600;
        font-family: var(--font-mono);
        transition: background-color 160ms var(--ease-out);
      }

      .key-grid button:hover {
        background: var(--fill-hover);
      }

      .key-grid button[aria-pressed='true'] {
        background: var(--chord);
        color: var(--ground);
      }

      .key-grid button[data-original='true']::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 5px;
        width: 4px;
        height: 4px;
        margin-left: -2px;
        background: currentColor;
        opacity: 0.7;
      }

      .pop .hint {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 12px 2px 0;
        color: var(--ink-3);
        font-size: 0.75rem;
        font-weight: 400;
      }

      .pop .hint i {
        width: 4px;
        height: 4px;
        background: currentColor;
      }

      .size-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .size-row .tap {
        width: 44px;
        height: 44px;
        background: var(--fill-hover);
      }

      .meter {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 4px;
        flex: 1;
        height: 26px;
      }

      .meter i {
        width: 8px;
        background: var(--pixel-off);
        transition: background-color 200ms var(--ease-out);
      }

      .meter i.on {
        background: var(--chord);
      }

      .pop .seg {
        width: 100%;
        padding: 2px;
        border-radius: 999px;
        background: var(--fill-hover);
      }

      .pop .seg button {
        height: 36px;
        padding: 0 10px;
      }

      .info-list {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 16px;
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 400;
      }

      .info-list dt {
        color: var(--ink-3);
      }

      .info-list dd {
        margin: 0;
      }

      .demo-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--hairline);
        font-size: 0.8125rem;
        color: var(--ink-2);
        font-weight: 400;
      }

      .demo-row b {
        display: block;
        color: var(--ink);
        font-weight: 600;
      }

      .switch {
        position: relative;
        flex: none;
        width: 46px;
        height: 28px;
        border-radius: 999px;
        background: var(--pixel-off);
        transition: background-color 200ms var(--ease-out);
      }

      .switch::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: var(--ink);
        transition: transform 360ms var(--ease-liquid);
      }

      .switch[aria-checked='true'] {
        background: var(--chord);
      }

      .switch[aria-checked='true']::after {
        transform: translateX(18px);
        background: var(--ground);
      }

      .scrim {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
      }

      .scrim[data-open='true'] {
        display: block;
      }

      .sheet {
        --glass-r: 28px;
        position: fixed;
        z-index: 45;
        left: 50%;
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + var(--dock-h) + 10px);
        width: min(calc(100% - 20px), 460px);
        max-height: min(62svh, 560px);
        display: flex;
        flex-direction: column;
        padding: 16px 8px 8px;
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, 18px) scale(0.92, 0.84);
        transform-origin: 50% 100%;
        transition:
          opacity 200ms var(--ease-out),
          transform 420ms var(--ease-liquid),
          visibility 0s linear 420ms;
      }

      .sheet[data-open='true'] {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
        transition:
          opacity 160ms var(--ease-out),
          transform 520ms var(--ease-liquid),
          visibility 0s;
      }

      .sheet-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 4px 10px 12px;
      }

      .sheet-head div {
        flex: 1;
        min-width: 0;
      }

      .sheet-head h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.25;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .sheet-head p {
        margin: 0;
        color: var(--ink-2);
        font-size: 0.8125rem;
        font-weight: 400;
      }

      .sheet .rail-list {
        padding-bottom: 4px;
      }

      .toast {
        --glass-r: 999px;
        position: fixed;
        z-index: 60;
        left: 50%;
        top: calc(max(10px, env(safe-area-inset-top)) + var(--bar-h) + 12px);
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 18px 0 14px;
        font-size: 0.9375rem;
        font-weight: 600;
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, -10px) scale(0.9);
        transition:
          opacity 200ms var(--ease-out),
          transform 420ms var(--ease-liquid),
          visibility 0s linear 420ms;
      }

      .toast svg {
        color: var(--chord);
      }

      .toast[data-open='true'] {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
        transition:
          opacity 160ms var(--ease-out),
          transform 480ms var(--ease-liquid),
          visibility 0s;
      }

      /* Phones: the dock carries the setlist, so hide what doesn't fit and tighten the bar. */
      @media (max-width: 479px) {
        .topbar {
          padding-left: 6px;
        }
        .signin {
          padding: 0 12px;
        }
        .seg button {
          padding: 0 12px;
        }
      }

      .menu-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 44px;
        margin-top: 12px;
        padding: 0 12px;
        border-radius: 14px;
        background: var(--fill-hover);
        font-weight: 600;
        font-size: 0.875rem;
      }

      @media (min-width: 480px) {
        .show-xs {
          display: none !important;
        }
      }

      @media (max-width: 479px) {
        .hide-xs {
          display: none !important;
        }
      }

      @media (max-width: 1023px) {
        .hide-sm {
          display: none !important;
        }
      }

      @media (min-width: 1024px) {
        .hide-lg {
          display: none !important;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          transition-duration: 1ms !important;
        }
      }

      /* ---------- Layout v2: Scroll & Dock (portrait), Stage Split (wide), Present (TV) ---------- */

      .scroll-view {
        position: relative;
        z-index: 1;
        max-width: 760px;
        margin: 0 auto;
        padding: calc(var(--bar-h) + max(10px, env(safe-area-inset-top)) + 28px) var(--gutter)
          calc(var(--dock-h) + 40px + env(safe-area-inset-bottom));
      }

      .scroll-view.two-col {
        max-width: 1200px;
      }

      .two-col .lyrics {
        columns: 2;
        column-gap: 56px;
      }

      .split .scroll-view,
      .split .edge {
        display: none;
      }

      /* Section jump: one chip per section of the song. */
      .jump {
        display: flex;
        gap: 6px;
        margin: 16px calc(var(--gutter) * -1) 0;
        padding: 0 var(--gutter) 2px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .jump::-webkit-scrollbar {
        display: none;
      }

      .jump button {
        flex: none;
        height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--fill-hover);
        color: var(--ink-2);
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
        transition:
          background-color 160ms var(--ease-out),
          color 160ms var(--ease-out);
      }

      .jump button:hover {
        background: var(--fill-press);
        color: var(--ink);
      }

      .lyrics section {
        scroll-margin-top: calc(var(--bar-h) + 40px);
      }

      .ghost {
        visibility: hidden;
      }

      /* Flow on: the next song's opening follows the end of this one. */
      .flow {
        margin-top: 44px;
        padding-top: 20px;
        border-top: 1px solid var(--hairline);
      }

      .flow-head {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 6px 0 18px;
        text-align: left;
      }

      .flow-head .pixel {
        width: 14px;
        height: 14px;
        background: var(--pixel-played);
      }

      .flow-head small {
        display: block;
        color: var(--ink-3);
        font-size: 0.8125rem;
      }

      .flow-head strong {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .flow-head .k {
        color: var(--chord);
        font-family: var(--font-mono);
        font-weight: 600;
      }

      .flow-body {
        opacity: 0.45;
      }

      .flow-hint {
        margin: 6px 0 0;
        color: var(--ink-3);
        font-size: 0.8125rem;
      }

      .flow-spacer {
        height: 46vh;
      }

      /* ---------- Dock v2: Aa · previous · set strip · next (named near the end) ---------- */
      .dock {
        grid-template-columns: 44px 48px minmax(0, 1fr) auto;
        padding: 0 6px;
      }

      .dock .tap {
        width: 48px;
      }

      .dock .read-btn {
        width: 44px;
        font-size: 0.9375rem;
        font-weight: 600;
      }

      .dock .next-btn {
        width: auto;
        min-width: 48px;
        padding: 0 12px;
        gap: 2px;
      }

      .next-name {
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        opacity: 0;
        font-size: 0.875rem;
        font-weight: 600;
        transition:
          max-width 480ms var(--ease-liquid),
          opacity 240ms var(--ease-out);
      }

      .named .next-name {
        max-width: 8.5rem;
        opacity: 1;
      }

      .named .next-btn {
        background: var(--fill-on);
      }

      .named .dock-label {
        display: none;
      }

      .dock-min .dock {
        grid-template-columns: 0 0 minmax(0, 1fr) 0;
      }

      .dock-min .dock .read-btn {
        opacity: 0;
        pointer-events: none;
        overflow: hidden;
      }

      /* ---------- Stage Split ---------- */
      .stage {
        display: none;
      }

      .split .stage {
        position: fixed;
        z-index: 1;
        top: calc(max(10px, env(safe-area-inset-top)) + var(--bar-h) + 10px);
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + var(--dock-h) + 6px);
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        max-width: 1440px;
        margin-inline: auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      .pane {
        position: relative;
        min-width: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 18px clamp(20px, 2.6vw, 40px) 48px;
        scrollbar-width: thin;
        -webkit-mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 40px), transparent);
        mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 40px), transparent);
        --title-size: clamp(1.75rem, 0.9rem + 1.9vw, 2.75rem);
      }

      .pane--right {
        border-left: 1px solid var(--hairline);
      }

      .pane .title-row {
        --title-size: inherit;
      }

      .pane-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 6px;
      }

      .pane-pick {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        margin-left: -10px;
        padding: 0 10px;
        border-radius: 10px;
        color: var(--ink-2);
        font-size: 0.8125rem;
        font-weight: 600;
        transition: background-color 160ms var(--ease-out);
      }

      .pane-pick:hover {
        background: var(--fill-hover);
        color: var(--ink);
      }

      .pane-pick .px {
        width: 16px;
        height: 16px;
      }

      .pane-pick .pin-dot {
        width: 6px;
        height: 6px;
        background: var(--chord);
      }

      .start-btn {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        height: 32px;
        padding: 0 6px 0 12px;
        border-radius: 999px;
        background: var(--fill-on);
        color: var(--ink);
        font-size: 0.8125rem;
        font-weight: 600;
        transition: transform 260ms var(--ease-liquid);
      }

      .start-btn:active {
        transform: scale(0.95);
      }

      .start-btn .px {
        width: 16px;
        height: 16px;
      }

      .pane--right .pane-body {
        opacity: 0.5;
        transition: opacity 300ms var(--ease-out);
      }

      .pane--right:hover .pane-body {
        opacity: 0.7;
      }

      .pane-end {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        height: 100%;
        color: var(--ink-2);
        text-align: center;
      }

      .pane-end .row {
        display: flex;
        gap: 5px;
      }

      .pane-end .row i {
        width: 10px;
        height: 10px;
        background: var(--pixel-played);
      }

      /* ---------- Song list: picking and reordering ---------- */
      .sheet-head .text-btn,
      .text-btn {
        height: 36px;
        padding: 0 10px;
        border-radius: 10px;
        color: var(--chord);
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .text-btn:hover {
        background: var(--fill-hover);
      }

      .sheet-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 44px;
        padding: 6px 4px 2px 12px;
        border-top: 1px solid var(--hairline);
        margin-top: 6px;
        color: var(--ink-3);
        font-size: 0.8125rem;
      }

      .song-row.editing {
        grid-template-columns: 28px 12px 20px minmax(0, 1fr) auto;
      }

      .grip {
        display: grid;
        place-items: center;
        width: 28px;
        height: 32px;
        border-radius: 8px;
        cursor: grab;
        touch-action: none;
      }

      .grip:hover {
        background: var(--fill-hover);
      }

      /* A grip drawn in pixels: two columns of three squares. */
      .grip::before {
        content: '';
        width: 3px;
        height: 3px;
        background: var(--ink-3);
        box-shadow:
          5px 0 var(--ink-3),
          0 5px var(--ink-3),
          5px 5px var(--ink-3),
          0 10px var(--ink-3),
          5px 10px var(--ink-3);
        transform: translate(-2.5px, -5px);
      }

      .dragging .song-row {
        background: var(--glass-tint-strong);
        box-shadow: 0 12px 24px -12px var(--shadow);
        outline: 1px solid var(--rim-lo);
      }

      .dragging {
        position: relative;
        z-index: 2;
      }

      .order-chip {
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--fill-on);
        color: var(--chord);
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .rail-list {
        flex: 1;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        list-style: none;
      }

      .pick-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: min(300px, calc(100vw - 48px));
        max-height: min(60vh, 420px);
        overflow-y: auto;
      }

      .pick-follow {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 10px;
        border-radius: 14px;
        color: var(--chord);
        font-size: 0.9375rem;
        font-weight: 600;
        text-align: left;
      }

      .pick-follow:hover {
        background: var(--fill-hover);
      }

      .pick-follow[aria-current='true'] {
        background: var(--fill-on);
      }

      /* ---------- Reading popover: size, auto-scroll, split ---------- */
      .read-pop {
        width: min(320px, calc(100vw - 24px));
      }

      .set-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--hairline);
        font-size: 0.875rem;
      }

      .set-row b {
        display: block;
        font-weight: 600;
      }

      .set-row .hint-text {
        display: block;
        color: var(--ink-3);
        font-size: 0.8125rem;
      }

      .speed {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .speed .tap {
        min-width: 36px;
        width: 36px;
        height: 36px;
        padding: 0;
      }

      .speed output {
        min-width: 3.4em;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.875rem;
        font-weight: 600;
      }

      .play-btn {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--fill-on);
        color: var(--chord);
      }

      /* Auto-scroll pill: rides above the dock while auto-scroll is in play. */
      .auto-pill {
        position: fixed;
        z-index: 31;
        left: 50%;
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + var(--dock-h) + 10px);
        display: flex;
        align-items: center;
        gap: 2px;
        height: 44px;
        padding: 0 6px 0 4px;
        transform: translateX(-50%);
        --glass-fill: var(--glass-tint-over);
      }

      .auto-pill output {
        min-width: 3.2em;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 600;
        text-align: center;
      }

      .auto-pill .tap {
        min-width: 36px;
        width: 36px;
        height: 36px;
        padding: 0;
      }

      .split .auto-pill {
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + var(--dock-h) + 14px);
      }

      .wake-note {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: var(--ink-3);
        font-size: 0.8125rem;
      }

      .wake-note i {
        width: 6px;
        height: 6px;
        background: var(--pixel-on);
      }

      .wake-note.off i {
        background: var(--pixel-off);
      }

      /* ---------- Present (TV) ---------- */
      .present {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        padding: clamp(16px, 3vh, 36px) clamp(20px, 4vw, 64px);
        background: var(--ground);
        color: var(--ink);
        cursor: default;
      }

      .present::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, var(--ground-lift) 0%, transparent 50vh);
        pointer-events: none;
      }

      .present > * {
        position: relative;
      }

      .p-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 44px;
        color: var(--ink-3);
        font-size: clamp(0.875rem, 1.1vw, 1.125rem);
      }

      .p-top .where {
        font-family: var(--font-mono);
      }

      .p-ctrls {
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0;
        transition: opacity 300ms var(--ease-out);
      }

      .present:hover .p-ctrls,
      .present.ctrls .p-ctrls,
      .p-ctrls:focus-within {
        opacity: 1;
      }

      .p-ctrls .glass {
        --glass-r: 999px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 14px;
        color: var(--ink);
        font-size: 0.875rem;
        font-weight: 600;
      }

      .p-ctrls .switch {
        width: 38px;
        height: 22px;
      }

      .p-ctrls .switch::after {
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
      }

      .p-ctrls .switch[aria-checked='true']::after {
        transform: translateX(16px);
      }

      .p-stage {
        display: grid;
        place-items: center;
        min-height: 0;
        overflow: hidden;
        text-align: center;
      }

      .p-slide {
        max-width: min(92vw, 1400px);
        animation: p-in 420ms var(--ease-out) both;
      }

      @keyframes p-in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }

      .p-label {
        margin-bottom: 0.9em;
        color: var(--label);
        font-size: clamp(0.875rem, 1.2vw, 1.25rem);
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .p-lines {
        font-size: var(--p-size, clamp(1.75rem, 4.2vw, 4.5rem));
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }

      .p-lines p {
        margin: 0;
      }

      .p-lines .line.has-chords {
        justify-content: center;
      }

      .p-title small {
        display: block;
        margin-bottom: 0.8em;
        color: var(--ink-3);
        font-family: var(--font-mono);
        font-size: clamp(0.875rem, 1.2vw, 1.25rem);
      }

      .p-title h2 {
        margin: 0;
        font-size: clamp(2.5rem, 6.5vw, 6rem);
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      .p-title p {
        margin: 0.5em 0 0;
        color: var(--ink-2);
        font-size: clamp(1rem, 1.8vw, 1.75rem);
      }

      .p-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 44px;
        color: var(--ink-3);
        font-size: clamp(0.9375rem, 1.4vw, 1.375rem);
      }

      .p-foot .next {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .p-foot .strip {
        display: flex;
        flex: none;
        gap: 6px;
      }

      .p-foot .strip i {
        width: 10px;
        height: 10px;
        background: var(--pixel-off);
      }

      .p-foot .strip i.played {
        background: var(--pixel-played);
      }

      .p-foot .strip i.now {
        background: var(--pixel-on);
      }

      .presenting body {
        overflow: hidden;
      }

      .title-row h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: var(--title-size);
        font-weight: 700;
        line-height: 1.04;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
