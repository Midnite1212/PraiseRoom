name: "PR Check"
on:
  pull_request:
    branches:
      - release
      - main

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            old-ui/yarn.lock
      - run: yarn install --frozen-lockfile
      # eslint-plugin-react detects the React version from old-ui/node_modules.
      - run: yarn --cwd old-ui install --frozen-lockfile
      - run: yarn lint

  old-ui:
    name: 'Old UI'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: old-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: old-ui/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
        env:
          CI: true

  server:
    name: 'Server'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: server/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
